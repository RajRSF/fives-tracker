<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15397F" />
<title>KW Harriers</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="KW Harriers" />
<style>
  /* ---------- Theme: KW Harriers (derived from kingsway.school.nz crest) ---------- */
  :root {
    /* KW brand — sourced directly from Kingsway School crest SVG */
    --kw-navy:      #15397F;   /* Crest navy — the authoritative brand blue */
    --kw-navy-dark: #0F2A60;   /* Slightly deeper navy for hovers/shadow */
    --kw-yellow:    #FFD200;   /* Crest yellow — the authoritative brand accent */
    --kw-yellow-soft: #FFF1B3; /* Pale yellow for backgrounds, hover wash */
    --kw-yellow-deep: #E0B900; /* Hover/border state for yellow surfaces */
    --kw-deep:      #00597C;   /* Secondary navy — sub-headers, hover surfaces */
    --kw-link:      #0170B9;
    --kw-accent:    #0174BD;
    --kw-ink:       #141B38;
    --kw-success:   #00B36A;
    --kw-warn:      var(--kw-yellow);
    --kw-danger:    #C53030;
    --kw-line:      #E5E7EB;
    --kw-muted:     #6B7280;
    --kw-bg-soft:   #F5F7FA;

    /* Legacy token aliases — kept so existing CSS rules don't need rewriting. */
    --pitch:        var(--kw-navy);
    --pitch-dark:   var(--kw-navy-dark);
    --pitch-deep:   var(--kw-ink);
    --chalk:        #FFFFFF;
    --ink:          var(--kw-ink);
    --ink-soft:     #2A3552;
    --paper:        var(--kw-bg-soft);
    --line:         var(--kw-line);
    --muted:        var(--kw-muted);
    --warn:         var(--kw-danger);
    --warn-bg:      #FDECEA;
    --win:          var(--kw-success);
    --draw:         var(--kw-muted);
    --loss:         var(--kw-danger);

    --shadow:       0 1px 2px rgba(0,32,92,0.06), 0 4px 12px rgba(0,32,92,0.05);
    --radius:       12px;
    --radius-sm:    8px;
    --tap:          44px;

    --font-brand: "Avenir Next", "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-brand);
    font-size: 16px;
    line-height: 1.4;
    -webkit-text-size-adjust: 100%;
    overflow-x: hidden;
  }
  body { min-height: 100vh; }
  h1, h2, h3 { margin: 0 0 0.5rem; font-weight: 800; letter-spacing: -0.01em; }
  h1 { font-size: 1.25rem; }
  h2 { font-size: 1.1rem; }
  h3 { font-size: 1rem; }
  p { margin: 0 0 0.5rem; }
  button { font: inherit; }
  input, select, textarea, button { font-family: inherit; }
  .scoreboard { font-variant-numeric: tabular-nums; font-weight: 800; letter-spacing: 0.02em; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- Layout ---------- */
  header {
    background: var(--kw-navy);
    color: var(--chalk);
    padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0;
    position: sticky; top: 0; z-index: 10;
    box-shadow: 0 2px 8px rgba(0,32,92,0.18);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 12px;
  }
  .brand-mark {
    width: 36px; height: 36px;
    flex: 0 0 auto;
    display: inline-block;
    background-image: url("icon-192.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    /* Subtle yellow halo so the crest sits cleanly on navy */
    filter: drop-shadow(0 0 0.5px rgba(255, 210, 0, 0.6));
  }
  .brand h1 {
    color: var(--chalk);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .tabs {
    display: flex;
    gap: 0;
    border-bottom: 0;
  }
  .tabs button {
    flex: 1;
    min-height: var(--tap);
    background: transparent;
    color: rgba(255,255,255,0.75);
    border: 0;
    border-bottom: 3px solid transparent;
    padding: 10px 8px;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .tabs button.active {
    color: var(--chalk);
    border-bottom-color: var(--kw-yellow);
  }
  main {
    padding: 16px;
    max-width: 720px;
    margin: 0 auto;
  }
  .card {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .row {
    display: flex; align-items: center; gap: 10px;
  }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .muted.small { font-size: 0.8rem; margin-top: 6px; }
  .stack > * + * { margin-top: 10px; }
  .settings-actions { gap: 8px; flex-wrap: wrap; }
  .settings-actions .btn { flex: 1 1 140px; min-width: 0; }

  /* ---------- Cloud sync card ---------- */
  .cloud-status {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.78rem; font-weight: 800;
    padding: 2px 10px; border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .cloud-status.bound { background: var(--kw-success); color: var(--chalk); }
  .cloud-status.unbound { background: var(--line); color: var(--ink-soft); }
  .cloud-status.syncing { background: var(--kw-yellow); color: var(--kw-ink); }
  .cloud-status.error { background: var(--kw-danger); color: var(--chalk); }
  .cloud-code-input {
    letter-spacing: 0.4em; text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 1.1rem;
  }
  .cloud-code-display {
    font-variant-numeric: tabular-nums;
    font-weight: 800; font-size: 1.15rem;
    letter-spacing: 0.3em;
    color: var(--kw-navy);
  }

  /* ---------- Form fields ---------- */
  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.92rem; }
  input[type=text], input[type=number], input[type=date], select {
    width: 100%;
    min-width: 0;
    max-width: 100%;
    min-height: var(--tap);
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--ink);
    font-size: 16px;
    font-family: inherit;
  }
  input[type=number] { font-variant-numeric: tabular-nums; }
  /* iOS Safari renders <input type="date"> at its intrinsic content width
     and ignores width:100% — this realigns it with sibling text inputs. */
  input[type=date] {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    text-align: left;
  }
  input[type=date]::-webkit-date-and-time-value { text-align: left; }
  input:focus, select:focus { outline: 2px solid var(--kw-yellow); outline-offset: 1px; border-color: var(--kw-navy); }
  .field { margin-bottom: 10px; }
  .field-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }

  /* ---------- Buttons ---------- */
  .btn {
    min-height: var(--tap);
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary {
    background: var(--pitch);
    border-color: var(--pitch-dark);
    color: var(--chalk);
  }
  .btn-primary:disabled { background: var(--muted); border-color: var(--muted); }
  .btn-danger {
    background: var(--warn);
    border-color: #962e22;
    color: var(--chalk);
  }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--pitch);
  }
  .btn-block { width: 100%; }
  .btn-sm { min-height: 36px; padding: 6px 10px; font-size: 0.85rem; }

  /* ---------- Roster ---------- */
  .player-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
  }
  .player-row + .player-row { margin-top: 8px; }
  .player-badge {
    width: 36px; height: 36px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--pitch); color: var(--chalk);
    font-weight: 800; font-size: 14px;
    flex: 0 0 auto;
  }
  .player-row input { border: 0; padding: 8px 6px; min-height: var(--tap); }
  .player-row input:focus { outline: 2px solid var(--pitch); outline-offset: 0; border-radius: 4px; }

  /* ---------- Starter picker ---------- */
  .picker {
    display: grid; grid-template-columns: 1fr; gap: 8px;
  }
  .pick-row {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: #fff;
    cursor: pointer;
    min-height: var(--tap);
  }
  .pick-row.starter {
    background: #eaf6ee;
    border-color: var(--pitch);
  }
  .pick-row .role {
    font-size: 0.75rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--line);
    color: var(--ink-soft);
  }
  .pick-row.starter .role {
    background: var(--pitch);
    color: var(--chalk);
  }
  .picker-meta {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
    font-weight: 700;
  }
  .count-pill {
    font-variant-numeric: tabular-nums;
    background: var(--ink-soft);
    color: var(--chalk);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 800;
  }
  .count-pill.ok { background: var(--pitch); }
  .count-pill.bad { background: var(--warn); }

  /* ---------- Subs ---------- */
  .sub-row {
    display: grid;
    grid-template-columns: 1fr 1fr 90px auto;
    gap: 6px;
    align-items: end;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: #fff;
  }
  .sub-row + .sub-row { margin-top: 8px; }
  .sub-row label { font-size: 0.75rem; margin-bottom: 2px; color: var(--muted); }
  .sub-row select, .sub-row input { min-height: 40px; }
  .sub-row .remove {
    align-self: end;
    min-height: 40px;
    width: 40px;
    padding: 0;
  }
  .err {
    color: var(--warn);
    background: var(--warn-bg);
    border: 1px solid #f5b7b1;
    border-radius: var(--radius-sm);
    padding: 6px 8px;
    font-size: 0.85rem;
    margin-top: 6px;
  }

  /* ---------- Stats grid ---------- */
  .stats-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 6px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    background: #fff;
  }
  .stats-row + .stats-row { margin-top: 8px; }
  .stats-row .name { font-weight: 700; }
  .stats-row .stat-line {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    align-items: end;
  }
  .stats-row .toggles {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    cursor: pointer;
    user-select: none;
    min-height: 36px;
    font-weight: 600;
    font-size: 0.85rem;
  }
  .toggle input { display: none; }
  .toggle .swatch {
    width: 14px; height: 18px; border-radius: 2px;
    border: 1px solid #aaa; background: #f3f3f3;
  }
  .toggle.yellow.on { background: #fff8d6; border-color: #d4b400; }
  .toggle.yellow.on .swatch { background: #f1c40f; border-color: #b58900; }
  .toggle.red.on { background: #fdecea; border-color: var(--warn); color: var(--warn); }
  .toggle.red.on .swatch { background: var(--warn); border-color: #962e22; }

  /* ---------- Match list ---------- */
  .match-card {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 10px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .match-card .opp { font-weight: 800; font-size: 1.05rem; }
  .match-card .when { color: var(--muted); font-size: 0.85rem; }
  .match-card .score {
    font-size: 1.4rem;
    font-variant-numeric: tabular-nums;
    font-weight: 900;
    text-align: right;
    line-height: 1;
  }
  .pill {
    display: inline-block;
    font-weight: 800;
    font-size: 0.75rem;
    letter-spacing: 0.06em;
    padding: 3px 10px;
    border-radius: 999px;
    color: var(--chalk);
    text-transform: uppercase;
  }
  .pill.W { background: var(--win); }
  .pill.D { background: var(--draw); }
  .pill.L { background: var(--loss); }

  /* ---------- Match detail ---------- */
  .detail-section { margin-top: 14px; }
  .detail-section h3 { margin-bottom: 6px; }
  .lineup-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .lineup-grid .col h4 {
    margin: 0 0 4px; font-size: 0.8rem; text-transform: uppercase;
    color: var(--muted); letter-spacing: 0.06em;
  }
  .lineup-grid li { padding: 4px 0; }
  .lineup-li { display: flex; align-items: center; gap: 8px; }
  .lineup-li .lineup-name { line-height: 1.2; }
  ul.clean { list-style: none; padding: 0; margin: 0; }
  .goals-timeline .goal-row,
  .goals-summary  .goal-row {
    display: grid;
    grid-template-columns: auto auto 1fr;
    align-items: baseline; gap: 8px;
    padding: 6px 8px; border-radius: var(--radius-sm);
    border-left: 3px solid transparent;
    background: #fafbfc;
  }
  .goals-timeline .goal-row + .goal-row,
  .goals-summary  .goal-row + .goal-row { margin-top: 4px; }
  .goals-summary .goal-row { grid-template-columns: 1fr auto; }
  .goal-row.goal-us   { border-left-color: var(--win); }
  .goal-row.goal-them { border-left-color: var(--loss); }
  .goal-row .g-time { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 2.4em; color: var(--muted); }
  .goal-row .g-team { font-weight: 700; }
  .goal-row .g-scorer { line-height: 1.25; }
  .goal-row .g-tally  { font-variant-numeric: tabular-nums; color: var(--muted); }
  table.dash {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
  }
  table.dash th, table.dash td {
    padding: 10px 8px;
    text-align: left;
    font-size: 0.95rem;
    border-bottom: 1px solid var(--line);
  }
  table.dash th {
    background: var(--pitch);
    color: var(--chalk);
    cursor: pointer;
    user-select: none;
    font-weight: 800;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    min-height: var(--tap);
  }
  table.dash th .arrow { display: inline-block; width: 1em; }
  table.dash td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  table.dash th.num { text-align: right; }
  table.dash tbody tr:last-child td { border-bottom: 0; }

  .empty {
    text-align: center;
    padding: 24px 12px;
    color: var(--muted);
  }

  /* ---------- Modal ---------- */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    max-width: 360px;
    width: 100%;
    padding: 18px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.25);
  }
  .modal h3 { margin-bottom: 8px; }
  .modal .actions {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 14px;
  }

  /* ---------- Score entry inline ---------- */
  .score-inline {
    display: grid; grid-template-columns: 1fr 22px 1fr; gap: 8px;
    align-items: end;
  }
  .score-inline .dash {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 900;
    line-height: var(--tap);
    color: var(--muted);
  }

  /* ---------- Live Match ---------- */
  .live-banner {
    display: flex; align-items: center; gap: 12px;
    background: var(--pitch); color: var(--chalk);
    padding: 12px 14px; border-radius: var(--radius);
    margin-bottom: 12px; box-shadow: var(--shadow);
    border-left: 3px solid var(--kw-yellow);
  }
  .live-banner .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #ff5b5b; box-shadow: 0 0 0 0 rgba(255,91,91,0.7);
    animation: livepulse 1.4s ease-out infinite;
  }
  @keyframes livepulse {
    0%   { box-shadow: 0 0 0 0 rgba(255,91,91,0.7); }
    70%  { box-shadow: 0 0 0 10px rgba(255,91,91,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,91,91,0); }
  }
  .live-banner .grow { flex: 1; }
  .live-banner .muted-on-pitch { color: rgba(255,255,255,0.78); font-size: 0.85rem; }
  .live-banner .btn { background: var(--chalk); color: var(--pitch); border: 0; min-height: var(--tap); padding: 0 14px; border-radius: var(--radius-sm); font-weight: 700; }

  .live-hud {
    background: linear-gradient(180deg, var(--pitch) 0%, var(--pitch-dark) 100%);
    color: var(--chalk);
    padding: 14px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }
  .live-hud .opp-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .live-hud .opp-line .opp { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.01em; opacity: 0.95; }
  .live-hud .opp-line .status { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
  .live-hud .scoreline {
    display: grid; grid-template-columns: 1fr auto 1fr;
    align-items: center; gap: 8px;
    margin: 6px 0 10px;
  }
  .live-hud .scoreline .side { text-align: center; min-width: 0; }
  .live-hud .scoreline .side .label {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.02em; opacity: 0.9;
    margin-bottom: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .live-hud .scoreline .side .val { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 2.6rem; line-height: 1; }
  .live-hud .scoreline .clock { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 2rem; padding: 0 6px; color: var(--kw-yellow); }
  .live-hud .clock-row { display: flex; gap: 8px; }
  .live-hud .clock-row .btn { flex: 1; min-height: var(--tap); border-radius: var(--radius-sm); font-weight: 700; border: 0; }
  .live-hud .btn-pause   { background: rgba(255,255,255,0.15); color: var(--chalk); }
  .live-hud .btn-pause:hover { background: rgba(255,255,255,0.22); }
  .live-hud .btn-resume  { background: var(--chalk); color: var(--pitch); }
  .live-hud .btn-end     { background: var(--warn); color: var(--chalk); }

  .live-actions {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
    margin-bottom: 12px;
  }
  .live-actions .btn { min-height: 52px; border-radius: var(--radius-sm); font-weight: 700; }
  .live-actions .btn-goal-us   { background: var(--kw-success); color: var(--kw-ink);   border: 0; font-weight: 700; }
  .live-actions .btn-goal-them { background: var(--kw-danger);  color: var(--chalk);    border: 0; font-weight: 700; }
  .live-actions .btn-sub       { background: var(--kw-deep);    color: var(--chalk);    border: 0; font-weight: 700; }
  .live-actions .btn-card      { background: var(--kw-warn);    color: var(--kw-ink);   border: 0; font-weight: 700; }

  .live-section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 4px 0 8px; }

  .live-roster-grid { display: grid; grid-template-columns: 1fr; gap: 6px; }
  .live-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius-sm); padding: 8px 10px;
    min-height: var(--tap);
  }
  .live-row.on-pitch { background: #eaf6ee; border-color: #bcdcc6; }
  .live-row.on-bench { background: #f5f7f4; }
  .live-row .pos {
    width: 28px; height: 28px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--pitch); color: var(--chalk);
    font-weight: 800; font-size: 0.78rem;
  }
  .live-row.on-bench .pos { background: var(--muted); }
  .pinitial {
    width: 30px; height: 30px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ink-soft); color: var(--chalk);
    font-weight: 800; font-size: 0.78rem;
    flex: 0 0 auto;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .pinitial.starter { background: var(--pitch); }
  .pinitial.bench   { background: var(--muted); }
  .pinitial.sm { width: 26px; height: 26px; font-size: 0.7rem; }
  .live-row .pname { flex: 1; font-weight: 600; }
  .live-row .ptime { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 56px; text-align: right; }
  .live-row .pmeta { display: flex; gap: 4px; }
  .live-row .pchip {
    font-size: 0.7rem; padding: 2px 6px; border-radius: 999px;
    background: var(--ink); color: var(--chalk); font-weight: 700;
  }
  .live-row .pchip.goal   { background: var(--win); }
  .live-row .pchip.assist { background: var(--pitch-dark); }
  .live-row .pchip.yellow { background: var(--kw-yellow); color: var(--ink); }
  .live-row .pchip.red    { background: var(--loss); }

  .live-row.tappable { cursor: pointer; }
  .live-row.tappable:active { transform: scale(0.99); }
  .live-row.preselected { outline: 2px solid var(--warn); outline-offset: -2px; }
  .live-row.armed { background: #fff8e1; border-color: #e6c66a; }
  .live-hint { margin: -4px 0 8px; font-size: 0.85rem; }
  .sub-toast {
    position: sticky; bottom: 12px;
    margin-top: 16px;
    display: flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--chalk);
    padding: 10px 14px; border-radius: var(--radius-sm);
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    z-index: 5;
  }
  .sub-toast-text { flex: 1; font-weight: 600; }
  .sub-toast-undo {
    background: transparent; color: var(--kw-yellow);
    border: 1px solid var(--kw-yellow);
    border-radius: 999px; min-height: 32px; padding: 4px 14px;
    font-weight: 800;
  }

  .live-events { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .live-event {
    display: flex; gap: 8px; align-items: baseline;
    font-size: 0.92rem; padding: 6px 8px; border-radius: var(--radius-sm);
    background: var(--paper); border-left: 3px solid var(--line);
  }
  .live-event.kind-goalUs   { border-left-color: var(--win); }
  .live-event.kind-goalThem { border-left-color: var(--loss); }
  .live-event.kind-sub      { border-left-color: var(--ink); }
  .live-event.kind-yellow   { border-left-color: var(--kw-yellow); }
  .live-event.kind-red      { border-left-color: var(--loss); }
  .live-event .e-time { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 44px; }
  .live-event .e-text { flex: 1; }
  .live-event .e-undo {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 999px; padding: 2px 8px; font-size: 0.78rem; cursor: pointer;
  }

  .picker.live-picker .pick-row { background: var(--paper); }
  .picker.live-picker .pick-row.disabled { opacity: 0.4; pointer-events: none; }

  details.past-match-disclosure { background: var(--paper); border: 1px dashed var(--line); border-radius: var(--radius-sm); padding: 8px 12px; }
  details.past-match-disclosure summary { cursor: pointer; font-weight: 600; color: var(--muted); list-style: none; min-height: var(--tap); display: flex; align-items: center; }
  details.past-match-disclosure summary::-webkit-details-marker { display: none; }
  details.past-match-disclosure[open] summary { color: var(--ink); margin-bottom: 8px; }

  /* ---------- Splash / launch ---------- */
  #splash {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--kw-navy);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: opacity 320ms ease, visibility 0s linear 320ms;
  }
  #splash .splash-mark {
    width: 128px; height: 128px;
    background-image: url("icon-192.png");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    animation: splashPop 420ms ease-out both;
  }
  #splash .splash-word {
    position: absolute; bottom: 18%;
    color: var(--chalk);
    font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    font-size: 0.78rem;
  }
  #splash .splash-word::after {
    content: ""; display: block;
    width: 28px; height: 2px; margin: 8px auto 0;
    background: var(--kw-yellow);
  }
  body.app-ready #splash {
    opacity: 0; visibility: hidden;
  }
  @keyframes splashPop {
    from { transform: scale(0.92); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
  }

  /* ---------- Responsive ---------- */
  @media (min-width: 480px) {
    .picker { grid-template-columns: 1fr 1fr; }
    .stats-row { grid-template-columns: 1.4fr 2fr; align-items: center; }
    .live-actions { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 600px) {
    .lineup-grid { grid-template-columns: 1fr 1fr 1fr; }
  }
</style>
</head>
<body>
<div id="splash" aria-hidden="true">
  <div class="splash-mark" role="img" aria-label="Kingsway School crest"></div>
  <div class="splash-word">KW Harriers</div>
</div>
<header>
  <div class="brand">
    <span class="brand-mark" role="img" aria-label="Kingsway School crest"></span>
    <h1>KW Harriers</h1>
  </div>
  <nav class="tabs" id="tabs" role="tablist">
    <button data-tab="roster"    role="tab">Roster</button>
    <button data-tab="matches"   role="tab">Matches</button>
    <button data-tab="dashboard" role="tab">Dashboard</button>
  </nav>
</header>

<main id="view"></main>

<div id="modal-root"></div>

<script>
"use strict";
/* =========================================================================
 * Fives Tracker — single-file vanilla app
 * Persistence: localStorage key "fivesTracker.v1"
 * ========================================================================= */

(function () {
  /* -------------------------- Constants -------------------------------- */
  const STORAGE_KEY     = "fivesTracker.v1";
  const SCHEMA_VERSION  = 1;
  const SQUAD_SIZE      = 8;
  const STARTERS_COUNT  = 5;
  const DEFAULT_LENGTH  = 40;
  const MIN_LENGTH      = 10;
  const MAX_LENGTH      = 90;
  const OUR_TEAM_NAME   = "KW Harriers";

  /* -------------------------- Utilities -------------------------------- */
  const $  = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const k of Object.keys(attrs)) {
        const v = attrs[k];
        if (v === null || v === undefined || v === false) continue;
        if (k === "class") node.className = v;
        else if (k === "dataset" && typeof v === "object") {
          for (const dk of Object.keys(v)) node.dataset[dk] = v[dk];
        } else if (k.startsWith("on") && typeof v === "function") {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === "html") {
          node.innerHTML = v;
        } else if (k in node && typeof node[k] !== "object") {
          try { node[k] = v; } catch { node.setAttribute(k, v); }
        } else {
          node.setAttribute(k, v);
        }
      }
    }
    appendChildren(node, children);
    return node;
  }
  function appendChildren(node, children) {
    if (children === null || children === undefined || children === false) return;
    if (Array.isArray(children)) {
      for (const c of children) appendChildren(node, c);
      return;
    }
    if (typeof children === "string" || typeof children === "number") {
      node.appendChild(document.createTextNode(String(children)));
      return;
    }
    if (children instanceof Node) {
      node.appendChild(children);
    }
  }
  function todayISO() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function fmtDate(iso) {
    if (!iso) return "";
    // Avoid TZ shifts: parse pieces directly.
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return iso;
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${parseInt(m[3],10)} ${months[parseInt(m[2],10)-1]} ${m[1]}`;
  }
  function uid(prefix) {
    return prefix + "-" + Math.random().toString(36).slice(2, 9) + "-" + Date.now().toString(36);
  }
  function initialsOf(name) {
    if (!name) return "?";
    const parts = String(name).trim().split(/\s+/).filter(Boolean);
    if (parts.length === 0) return "?";
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  }
  function clampInt(n, lo, hi, fallback) {
    n = parseInt(n, 10);
    if (!Number.isFinite(n)) return fallback;
    if (n < lo) return lo;
    if (n > hi) return hi;
    return n;
  }
  function deepClone(obj) {
    return JSON.parse(JSON.stringify(obj));
  }

  /* =========================================================================
   * Store — localStorage persistence + state mutations
   * ======================================================================= */
  const Store = (function () {
    let state = null;
    const listeners = new Set();

    function defaultPlayers() {
      const out = [];
      for (let i = 1; i <= SQUAD_SIZE; i++) {
        out.push({ id: "p" + i, name: "Player " + i });
      }
      return out;
    }
    function defaultState() {
      return {
        schemaVersion: SCHEMA_VERSION,
        players: defaultPlayers(),
        matches: [],
        liveMatch: null,
        settings: { defaultMatchLength: DEFAULT_LENGTH }
      };
    }

    function migrate(raw) {
      // Forward-only migration. Unknown / missing schemaVersion → treat as v1.
      const s = raw && typeof raw === "object" ? raw : {};
      const out = defaultState();
      out.schemaVersion = SCHEMA_VERSION;

      // Players: enforce exactly SQUAD_SIZE; preserve IDs/names where possible.
      const provided = Array.isArray(s.players) ? s.players : [];
      const players = [];
      for (let i = 0; i < SQUAD_SIZE; i++) {
        const p = provided[i];
        if (p && typeof p === "object" && typeof p.id === "string") {
          players.push({
            id: p.id,
            name: typeof p.name === "string" && p.name.trim() ? p.name : "Player " + (i + 1)
          });
        } else {
          players.push({ id: "p" + (i + 1), name: "Player " + (i + 1) });
        }
      }
      out.players = players;

      // Matches: keep only well-formed entries.
      const matches = Array.isArray(s.matches) ? s.matches : [];
      const validIds = new Set(players.map(p => p.id));
      out.matches = matches.filter(m => isValidMatch(m, validIds))
                           .map(normaliseMatch);

      // Settings.
      if (s.settings && typeof s.settings === "object") {
        const dml = clampInt(s.settings.defaultMatchLength, MIN_LENGTH, MAX_LENGTH, DEFAULT_LENGTH);
        out.settings.defaultMatchLength = dml;
      }

      // Live match (added in v1.1, additive — absent on older blobs is fine).
      out.liveMatch = sanitiseLive(s.liveMatch, validIds);
      return out;
    }

    function sanitiseLive(lm, validIds) {
      if (!lm || typeof lm !== "object") return null;
      const starters = Array.isArray(lm.starters) ? lm.starters.filter(id => validIds.has(id)) : [];
      if (starters.length !== STARTERS_COUNT) return null;
      const matchLength = clampInt(lm.matchLength, MIN_LENGTH, MAX_LENGTH, DEFAULT_LENGTH);
      const startedAt   = typeof lm.startedAt === "string" ? lm.startedAt : new Date().toISOString();
      const opponent    = typeof lm.opponent === "string" ? lm.opponent : "";
      const date        = typeof lm.date === "string" ? lm.date : todayISO();
      const events      = Array.isArray(lm.events) ? lm.events.filter(e => e && typeof e === "object") : [];
      const elapsedMs   = Number.isFinite(lm.elapsedMs) ? Math.max(0, lm.elapsedMs) : 0;
      const lastResumeAt = (lm.lastResumeAt === null || lm.lastResumeAt === undefined)
        ? null
        : (typeof lm.lastResumeAt === "string" ? lm.lastResumeAt : null);
      const paused = !!lm.paused;
      return {
        opponent, date, matchLength,
        starters: starters.slice(),
        startedAt,
        elapsedMs,
        lastResumeAt,
        paused,
        events
      };
    }

    function isValidMatch(m, validIds) {
      if (!m || typeof m !== "object") return false;
      if (typeof m.id !== "string") return false;
      if (typeof m.opponent !== "string") return false;
      if (typeof m.date !== "string") return false;
      if (!Array.isArray(m.starters) || m.starters.length !== STARTERS_COUNT) return false;
      for (const id of m.starters) if (!validIds.has(id)) return false;
      if (!Number.isFinite(m.matchLength)) return false;
      return true;
    }
    function normaliseMatch(m) {
      const matchCap = clampInt(m.matchLength, 1, MAX_LENGTH, MIN_LENGTH);
      const subs = Array.isArray(m.subs) ? m.subs.map(s => ({
        off:    String(s.off),
        on:     String(s.on),
        minute: clampInt(s.minute, 1, matchCap, 1)
      })) : [];
      const stats = (m.stats && typeof m.stats === "object") ? m.stats : {};
      const cleanStats = {};
      for (const pid of Object.keys(stats)) {
        const s = stats[pid] || {};
        cleanStats[pid] = {
          goals:   clampInt(s.goals, 0, 999, 0),
          assists: clampInt(s.assists, 0, 999, 0),
          yellow:  !!s.yellow,
          red:     !!s.red
        };
      }
      // Goals timeline (added in v1.1, optional) — older matches without
      // goals[] just get an empty array and the detail view falls back to
      // reconstructing scorers from `stats`.
      const goals = Array.isArray(m.goals) ? m.goals.map(g => {
        const minute = clampInt(g.minute, 0, matchCap, 0);
        if (g.side === "them") return { side: "them", minute: minute };
        return {
          side:   "us",
          minute: minute,
          scorer: g.scorer != null ? String(g.scorer) : null,
          assist: g.assist != null ? String(g.assist) : null
        };
      }) : [];
      return {
        id:           m.id,
        opponent:     m.opponent,
        date:         m.date,
        matchLength:  matchCap,
        ourScore:     clampInt(m.ourScore, 0, 999, 0),
        theirScore:   clampInt(m.theirScore, 0, 999, 0),
        starters:     m.starters.slice(),
        subs:         subs,
        stats:        cleanStats,
        goals:        goals,
        createdAt:    typeof m.createdAt === "string" ? m.createdAt : new Date().toISOString()
      };
    }

    function load() {
      let raw = null;
      try {
        const txt = localStorage.getItem(STORAGE_KEY);
        if (txt) raw = JSON.parse(txt);
      } catch (e) {
        // Corrupt blob — fall through to defaults; never crash.
        console.warn("Fives Tracker: failed to parse stored state, resetting.", e);
        raw = null;
      }
      state = raw ? migrate(raw) : defaultState();
      persist();
    }
    function persist() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Fives Tracker: localStorage write failed.", e);
      }
    }
    function notify() {
      for (const fn of listeners) {
        try { fn(state); } catch (e) { console.error(e); }
      }
    }

    function getState() { return state; }
    function getPlayer(id) { return state.players.find(p => p.id === id) || null; }
    function playerName(id) {
      const p = getPlayer(id);
      return p ? p.name : "(unknown)";
    }

    function updatePlayerName(id, name) {
      const p = getPlayer(id);
      if (!p) return;
      const trimmed = (name || "").trim();
      p.name = trimmed || p.name;
      persist();
      notify();
    }
    function addMatch(match) {
      const m = normaliseMatch(Object.assign({ id: uid("m"), createdAt: new Date().toISOString() }, match));
      state.matches.push(m);
      persist();
      notify();
      return m;
    }
    function deleteMatch(id) {
      const before = state.matches.length;
      state.matches = state.matches.filter(m => m.id !== id);
      if (state.matches.length !== before) {
        persist();
        notify();
      }
    }
    function subscribe(fn) {
      listeners.add(fn);
      return () => listeners.delete(fn);
    }

    /* ---------- Live match ---------- */
    function startLiveMatch({ opponent, date, matchLength, starters }) {
      if (!Array.isArray(starters) || starters.length !== STARTERS_COUNT) {
        throw new Error("startLiveMatch: must provide " + STARTERS_COUNT + " starters");
      }
      const validIds = new Set(state.players.map(p => p.id));
      for (const id of starters) if (!validIds.has(id)) throw new Error("startLiveMatch: unknown player id " + id);
      state.liveMatch = {
        opponent: (opponent || "").trim(),
        date: date || todayISO(),
        matchLength: clampInt(matchLength, MIN_LENGTH, MAX_LENGTH, DEFAULT_LENGTH),
        starters: starters.slice(),
        startedAt: new Date().toISOString(),
        elapsedMs: 0,
        lastResumeAt: new Date().toISOString(),
        paused: false,
        events: []
      };
      persist();
      notify();
    }
    function getLive() { return state.liveMatch; }
    function liveElapsedMs(now) {
      const lm = state.liveMatch;
      if (!lm) return 0;
      // No cap — the clock runs until the coach taps End. Actual duration
      // is recorded at end-match time. Hard ceiling at MAX_LENGTH minutes
      // protects against forgotten-running matches blowing up the engine.
      const cap = MAX_LENGTH * 60 * 1000;
      let ms = lm.elapsedMs;
      if (!lm.paused && lm.lastResumeAt) {
        const t = (typeof now === "number" ? now : Date.now()) - new Date(lm.lastResumeAt).getTime();
        ms += Math.max(0, t);
      }
      return Math.min(cap, Math.max(0, ms));
    }
    function pauseLive() {
      const lm = state.liveMatch;
      if (!lm || lm.paused) return;
      lm.elapsedMs = liveElapsedMs();
      lm.paused = true;
      lm.lastResumeAt = null;
      persist(); notify();
    }
    function resumeLive() {
      const lm = state.liveMatch;
      if (!lm || !lm.paused) return;
      lm.paused = false;
      lm.lastResumeAt = new Date().toISOString();
      persist(); notify();
    }
    function appendLiveEvent(ev) {
      const lm = state.liveMatch;
      if (!lm) return null;
      const atMs = liveElapsedMs();
      const minute = Math.max(0, Math.min(MAX_LENGTH, Math.floor(atMs / 60000)));
      // Subs at minute 0 are forced to 1 because the saved-record engine uses 1-based minutes.
      const subMinute = Math.max(1, minute);
      const event = Object.assign(
        { id: uid("e"), at: new Date().toISOString(), atMs, minute, subMinute },
        ev
      );
      lm.events.push(event);
      persist(); notify();
      return event;
    }
    function removeLiveEvent(id) {
      const lm = state.liveMatch;
      if (!lm) return;
      const before = lm.events.length;
      lm.events = lm.events.filter(e => e.id !== id);
      if (lm.events.length !== before) { persist(); notify(); }
    }
    function liveOnPitch() {
      const lm = state.liveMatch;
      if (!lm) return new Set();
      const onPitch = new Set(lm.starters);
      const subs = lm.events.filter(e => e.kind === "sub").slice().sort((a, b) => a.subMinute - b.subMinute);
      for (const s of subs) {
        if (onPitch.has(s.off)) onPitch.delete(s.off);
        onPitch.add(s.on);
      }
      return onPitch;
    }
    function cancelLiveMatch() {
      state.liveMatch = null;
      persist(); notify();
    }
    /**
     * Convert the live match to a saved match record and clear the live slot.
     * Returns the saved match.
     */
    function endLiveMatch() {
      const lm = state.liveMatch;
      if (!lm) return null;
      const subs = lm.events.filter(e => e.kind === "sub").map(e => ({
        off: e.off, on: e.on, minute: e.subMinute
      })).sort((a, b) => a.minute - b.minute);

      let ourScore = 0, theirScore = 0;
      const stats = {};
      const appeared = new Set(lm.starters);
      for (const s of subs) appeared.add(s.on);
      for (const pid of appeared) stats[pid] = { goals: 0, assists: 0, yellow: false, red: false };

      for (const e of lm.events) {
        if (e.kind === "goalUs") {
          ourScore++;
          if (e.scorer && stats[e.scorer]) stats[e.scorer].goals++;
          if (e.assist && stats[e.assist]) stats[e.assist].assists++;
        } else if (e.kind === "goalThem") {
          theirScore++;
        } else if (e.kind === "yellow" && e.player && stats[e.player]) {
          stats[e.player].yellow = true;
        } else if (e.kind === "red" && e.player && stats[e.player]) {
          stats[e.player].red = true;
        }
      }
      // Actual played minutes = ceil(elapsed-ms / 60s), with floor of 1 (a
      // 30-second test still saves as 1 min, not 10) and a ceiling at
      // MAX_LENGTH (forgotten-running guard). MIN_LENGTH only governs the
      // post-match backfill form, where a typed sub-10 value is likely a typo.
      const actualMs      = Math.max(0, liveElapsedMs());
      const actualMinutes = clampInt(Math.ceil(actualMs / 60000), 1, MAX_LENGTH, 1);

      const goals = lm.events
        .filter(e => e.kind === "goalUs" || e.kind === "goalThem")
        .map(e => e.kind === "goalUs"
          ? { side: "us", minute: e.minute, scorer: e.scorer || null, assist: e.assist || null }
          : { side: "them", minute: e.minute })
        .sort((a, b) => a.minute - b.minute);

      const saved = addMatch({
        opponent:    lm.opponent || "",
        date:        lm.date,
        matchLength: actualMinutes,
        ourScore:    ourScore,
        theirScore:  theirScore,
        starters:    lm.starters.slice(),
        subs:        subs,
        stats:       stats,
        goals:       goals
      });
      state.liveMatch = null;
      persist(); notify();
      return saved;
    }

    function exportState() {
      // Deep clone via the same JSON path the persister uses, so what you
      // export is exactly what survives a save/load round-trip.
      return {
        format:        "fives-tracker",
        schemaVersion: SCHEMA_VERSION,
        exportedAt:    new Date().toISOString(),
        state:         JSON.parse(JSON.stringify(state))
      };
    }
    function importState(raw) {
      // Accept either a wrapped export envelope or a bare state blob.
      const candidate = (raw && typeof raw === "object" && raw.state && typeof raw.state === "object")
        ? raw.state
        : raw;
      const next = migrate(candidate);
      state = next;
      persist();
      notify();
      return summariseState(next);
    }
    function summariseState(s) {
      return {
        players: s.players.length,
        matches: s.matches.length,
        hasLive: !!s.liveMatch
      };
    }

    return {
      load, getState, getPlayer, playerName,
      updatePlayerName, addMatch, deleteMatch, subscribe,
      // live
      startLiveMatch, getLive, liveElapsedMs, pauseLive, resumeLive,
      appendLiveEvent, removeLiveEvent, liveOnPitch,
      endLiveMatch, cancelLiveMatch,
      // durability
      exportState, importState,
      // for tests / introspection
      _defaultState: defaultState, _migrate: migrate
    };
  })();

  /* =========================================================================
   * MinutesEngine — pure functions
   * ======================================================================= */
  const MinutesEngine = (function () {
    /**
     * computeMinutesByPlayer
     * @param {string[]} starters     — exactly STARTERS_COUNT player IDs on pitch at minute 0
     * @param {{off:string,on:string,minute:number}[]} subs
     * @param {number} matchLength
     * @returns {Map<string,number>}
     */
    function computeMinutesByPlayer(starters, subs, matchLength) {
      const minutes = new Map();
      const stintStart = new Map();           // pid → minute when current stint started
      // Initialise starter stints.
      for (const pid of starters) {
        stintStart.set(pid, 0);
        if (!minutes.has(pid)) minutes.set(pid, 0);
      }
      // Defensive copy + sort by minute ascending; stable for equal minutes.
      const ordered = (subs || []).slice().sort((a, b) => a.minute - b.minute);
      for (const s of ordered) {
        // Close OFF player's stint at s.minute (if open).
        if (stintStart.has(s.off)) {
          const start = stintStart.get(s.off);
          const delta = Math.max(0, s.minute - start);
          minutes.set(s.off, (minutes.get(s.off) || 0) + delta);
          stintStart.delete(s.off);
        }
        // Open ON player's stint at s.minute.
        stintStart.set(s.on, s.minute);
        if (!minutes.has(s.on)) minutes.set(s.on, 0);
      }
      // Close any still-open stints at full time.
      for (const [pid, start] of stintStart.entries()) {
        const delta = Math.max(0, matchLength - start);
        minutes.set(pid, (minutes.get(pid) || 0) + delta);
      }
      return minutes;
    }

    /**
     * Set of player IDs who appeared in a match (started OR subbed on).
     */
    function summariseAppearances(match) {
      const appeared = new Set(match.starters);
      for (const s of match.subs || []) appeared.add(s.on);
      return appeared;
    }

    return { computeMinutesByPlayer, summariseAppearances };
  })();

  /* =========================================================================
   * App controller — tabs, ephemeral form state, render dispatch
   * ======================================================================= */
  const App = (function () {
    const view = $("#view");
    const tabs = $("#tabs");
    let currentTab = "roster";

    // Match-form ephemeral state (lives across re-renders inside the form session).
    let formState = null;
    function newFormState() {
      const s = Store.getState();
      return {
        opponent:     "",
        date:         todayISO(),
        matchLength:  s.settings.defaultMatchLength || DEFAULT_LENGTH,
        ourScore:     "",
        theirScore:   "",
        starters:     [],   // selected starter IDs
        subs:         [],   // {off, on, minute, _key}
        stats:        {},   // playerId → {goals, assists, yellow, red}
        showForm:     false,
        errors:       []
      };
    }

    // Detail view state
    let openMatchId = null;

    // Dashboard sort state
    let dashSort = { col: "minutes", dir: "desc" };

    // Live setup form state (when no live match exists yet but user clicked "Start Live").
    let liveSetup = null;
    function newLiveSetup() {
      const s = Store.getState();
      return {
        opponent:    "",
        date:        todayISO(),
        matchLength: s.settings.defaultMatchLength || DEFAULT_LENGTH,
        starters:    [],
        showForm:    false,
        errors:      []
      };
    }

    // Live-action transient state — picking targets for goal/sub/card flows.
    // shape: { kind: 'goalUs'|'sub'|'card', step, partial:{} }
    let livePicker = null;

    // Ticker handle for re-rendering the live clock once per second.
    let liveTickHandle = null;

    // Toast state for the most recent sub — gives the user 5s to undo.
    let lastSubToast = null;          // { eventId, offId, onId, expiresAt }
    let lastSubToastHandle = null;    // setTimeout handle

    function clearSubToast() {
      if (lastSubToastHandle) { clearTimeout(lastSubToastHandle); lastSubToastHandle = null; }
      lastSubToast = null;
    }
    function flashSubToast(eventId, offId, onId) {
      clearSubToast();
      lastSubToast = { eventId, offId, onId, expiresAt: Date.now() + 5000 };
      lastSubToastHandle = setTimeout(() => {
        lastSubToast = null;
        lastSubToastHandle = null;
        render();
      }, 5000);
    }

    function setTab(tab) {
      currentTab = tab;
      // When leaving Matches view fully, drop detail state but keep form open if user toggled it.
      if (tab !== "matches") {
        openMatchId = null;
        livePicker = null;
      }
      $$("#tabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === tab);
        b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false");
      });
      render();
    }

    function init() {
      Store.load();
      Store.subscribe(() => { manageTicker(); render(); });
      // Cloud sync — boot fetch + debounced auto-push.
      Store.subscribe(() => { Cloud.scheduleAutoPush(); });
      Cloud.bootSync();
      tabs.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-tab]");
        if (btn) setTab(btn.dataset.tab);
      });
      formState = newFormState();
      liveSetup = newLiveSetup();
      // Boot directly into Matches/Live if a live match exists; else Roster.
      if (Store.getLive()) setTab("matches");
      else setTab("roster");
      manageTicker();
      // Hold the splash for a beat so the crest is felt, then fade.
      setTimeout(() => { document.body.classList.add("app-ready"); }, 420);
    }

    /**
     * Re-render once per second whenever a live match is running and not paused.
     * Tick stops on pause/end so we don't burn battery on the sideline.
     */
    function manageTicker() {
      const lm = Store.getLive();
      const wantTick = !!lm && !lm.paused;
      if (wantTick && !liveTickHandle) {
        liveTickHandle = setInterval(() => {
          if (currentTab === "matches" && !openMatchId) render();
        }, 1000);
      } else if (!wantTick && liveTickHandle) {
        clearInterval(liveTickHandle);
        liveTickHandle = null;
      }
    }

    function render() {
      view.innerHTML = "";
      if (currentTab === "roster")    Render.renderRoster(view, dataApi, cloudApi);
      else if (currentTab === "matches") {
        if (openMatchId) Render.renderMatchDetail(view, openMatchId, exitDetail, requestDeleteMatch);
        else if (Store.getLive()) Render.renderLiveMatch(view, livePicker, liveApi);
        else Render.renderMatches(view, formState, formApi, liveSetup, liveApi);
      }
      else if (currentTab === "dashboard") Render.renderDashboard(view, dashSort, setDashSort);
    }

    function setDashSort(col) {
      if (dashSort.col === col) {
        dashSort.dir = dashSort.dir === "asc" ? "desc" : "asc";
      } else {
        dashSort.col = col;
        dashSort.dir = (col === "name") ? "asc" : "desc";
      }
      render();
    }

    function exitDetail() { openMatchId = null; render(); }
    function openDetail(id) { openMatchId = id; render(); }
    function requestDeleteMatch(id) {
      Modal.confirm({
        title: "Delete this match?",
        message: "This will permanently remove the match and its stats. Dashboard totals will recompute.",
        confirmLabel: "Delete",
        danger: true,
        onConfirm: () => {
          Store.deleteMatch(id);
          openMatchId = null;
          render();
        }
      });
    }

    /* ---------- Data API: export / import JSON for backup + transfer ---------- */
    const dataApi = {
      exportData() {
        const payload = Store.exportState();
        const json = JSON.stringify(payload, null, 2);
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "fives-tracker-" + todayISO() + ".json";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        // Revoke after a tick so the browser can finish the download.
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      },
      pickImportFile() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "application/json,.json";
        input.style.display = "none";
        input.addEventListener("change", () => {
          const file = input.files && input.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            let parsed = null;
            try { parsed = JSON.parse(reader.result); }
            catch (e) {
              Modal.confirm({
                title: "Import failed",
                message: "That file isn't valid JSON. Pick a different file and try again.",
                confirmLabel: "OK",
                onConfirm: () => {}
              });
              return;
            }
            // Preview what migrate() would accept, so the confirm dialog is honest.
            let preview = null;
            try {
              const candidate = (parsed && typeof parsed === "object" && parsed.state)
                ? parsed.state : parsed;
              preview = Store._migrate(candidate);
            } catch (e) {
              Modal.confirm({
                title: "Import failed",
                message: "Couldn't read that backup. The file may be corrupted.",
                confirmLabel: "OK",
                onConfirm: () => {}
              });
              return;
            }
            const msg =
              "Replace current data with: " +
              preview.players.length + " players, " +
              preview.matches.length + " matches" +
              (preview.liveMatch ? ", and a live match in progress" : "") +
              ". This will overwrite everything currently saved.";
            Modal.confirm({
              title: "Import backup?",
              message: msg,
              confirmLabel: "Replace",
              danger: true,
              onConfirm: () => {
                Store.importState(parsed);
                openMatchId = null;
                livePicker = null;
                clearSubToast();
                render();
              }
            });
          };
          reader.readAsText(file);
        });
        document.body.appendChild(input);
        input.click();
        // The change handler keeps the input alive; remove it after a beat.
        setTimeout(() => { if (input.parentNode) input.parentNode.removeChild(input); }, 5000);
      }
    };

    /* ---------- Cloud sync: 6-digit code → /api/sync (Vercel KV) -----------
     * Capability auth: anyone with the code reads/writes the same blob.
     * Last-write-wins via Date.now() timestamp; we prompt before pulling
     * a remote that's newer than the local snapshot, so a sideline edit
     * isn't quietly overwritten by another device's stale state.
     * --------------------------------------------------------------------- */
    const Cloud = (function () {
      const CODE_KEY    = "fivesTracker.cloud.code";
      const META_KEY    = "fivesTracker.cloud.meta";
      const ENDPOINT    = "/api/sync";
      const PUSH_DEBOUNCE_MS = 1500;

      let pushTimer = null;
      let pushInFlight = false;
      let pushAgainAfter = false;
      let suppressAutoPush = 0;  // counter — non-zero while we're applying a remote pull
      let lastStatus = "idle";   // idle | syncing | ok | error | offline
      let lastError = "";
      let lastSyncedAt = 0;

      function getCode() {
        try { return localStorage.getItem(CODE_KEY) || ""; }
        catch { return ""; }
      }
      function setCode(code) {
        try { localStorage.setItem(CODE_KEY, code); }
        catch (e) { console.warn("Cloud: code write failed", e); }
      }
      function clearCode() {
        try {
          localStorage.removeItem(CODE_KEY);
          localStorage.removeItem(META_KEY);
        } catch {}
        lastStatus = "idle";
        lastError = "";
        lastSyncedAt = 0;
      }
      function isBound() { return /^\d{6}$/.test(getCode()); }
      function generateCode() {
        return String(Math.floor(100000 + Math.random() * 900000));
      }
      function getMeta() {
        try {
          const raw = localStorage.getItem(META_KEY);
          if (!raw) return { lastUpdated: 0, lastSyncedAt: 0 };
          const o = JSON.parse(raw);
          return {
            lastUpdated:   Number.isFinite(o.lastUpdated)   ? o.lastUpdated   : 0,
            lastSyncedAt:  Number.isFinite(o.lastSyncedAt)  ? o.lastSyncedAt  : 0
          };
        } catch { return { lastUpdated: 0, lastSyncedAt: 0 }; }
      }
      function setMeta(updated, syncedAt) {
        try {
          localStorage.setItem(META_KEY, JSON.stringify({
            lastUpdated:  updated  || 0,
            lastSyncedAt: syncedAt || 0
          }));
        } catch {}
      }
      function status() {
        return {
          bound: isBound(),
          code: getCode(),
          status: lastStatus,
          error: lastError,
          lastSyncedAt
        };
      }

      function setStatus(s, err) {
        lastStatus = s;
        lastError = err || "";
        // Re-render so the status pill reflects the new state.
        if (currentTab === "roster") render();
      }

      async function pull(opts) {
        const code = getCode();
        if (!/^\d{6}$/.test(code)) {
          setStatus("error", "No code set");
          return { ok: false, reason: "no_code" };
        }
        setStatus("syncing");
        try {
          const res = await fetch(ENDPOINT + "?code=" + encodeURIComponent(code), {
            method: "GET",
            headers: { accept: "application/json" },
            cache: "no-store"
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus("error", body.error || ("HTTP " + res.status));
            return { ok: false, reason: body.error || "http_error" };
          }
          if (!body.exists) {
            setStatus("ok");
            return { ok: true, exists: false };
          }
          // Apply.
          if (opts && opts.previewOnly) {
            return { ok: true, exists: true, data: body.data, updated: body.updated || 0 };
          }
          suppressAutoPush++;
          try { Store.importState(body.data); }
          finally {
            // Release on next tick so the subscribe-fired auto-push sees the flag.
            setTimeout(() => { suppressAutoPush = Math.max(0, suppressAutoPush - 1); }, 0);
          }
          lastSyncedAt = Date.now();
          setMeta(body.updated || 0, lastSyncedAt);
          setStatus("ok");
          return { ok: true, exists: true, updated: body.updated || 0 };
        } catch (err) {
          setStatus("error", String(err.message || err));
          return { ok: false, reason: "network" };
        }
      }

      async function push() {
        const code = getCode();
        if (!/^\d{6}$/.test(code)) return { ok: false, reason: "no_code" };
        if (pushInFlight) { pushAgainAfter = true; return { ok: false, reason: "in_flight" }; }
        pushInFlight = true;
        setStatus("syncing");
        try {
          const payload = Store.exportState();
          const res = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ code, data: payload })
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) {
            setStatus("error", body.error || ("HTTP " + res.status));
            return { ok: false, reason: body.error || "http_error" };
          }
          lastSyncedAt = Date.now();
          setMeta(body.updated || lastSyncedAt, lastSyncedAt);
          setStatus("ok");
          return { ok: true, updated: body.updated };
        } catch (err) {
          setStatus("error", String(err.message || err));
          return { ok: false, reason: "network" };
        } finally {
          pushInFlight = false;
          if (pushAgainAfter) {
            pushAgainAfter = false;
            setTimeout(() => { push(); }, 200);
          }
        }
      }

      function scheduleAutoPush() {
        if (!isBound()) return;
        if (suppressAutoPush > 0) return;
        if (pushTimer) clearTimeout(pushTimer);
        pushTimer = setTimeout(() => {
          pushTimer = null;
          push();
        }, PUSH_DEBOUNCE_MS);
      }

      async function bootSync() {
        if (!isBound()) return;
        // Detect a remote that's newer than what we last pulled. If so,
        // ask before adopting — coach may have an active local match they
        // don't want overwritten.
        const meta = getMeta();
        setStatus("syncing");
        try {
          const res = await fetch(ENDPOINT + "?code=" + encodeURIComponent(getCode()), {
            method: "GET", headers: { accept: "application/json" }, cache: "no-store"
          });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) { setStatus("error", body.error || ("HTTP " + res.status)); return; }
          if (!body.exists) {
            // First time on this code — push our local copy so other devices can pull it.
            await push();
            return;
          }
          const remoteUpdated = body.updated || 0;
          const localUpdated  = meta.lastUpdated || 0;
          if (remoteUpdated > localUpdated) {
            // Remote is newer than our last sync — ask the user.
            Modal.confirm({
              title: "Cloud has newer data",
              message: "A more recent backup is in the cloud (" + new Date(remoteUpdated).toLocaleString() +
                ").\n\nReplace this device's data with the cloud copy?",
              confirmLabel: "Pull cloud copy",
              danger: false,
              onConfirm: () => {
                suppressAutoPush++;
                try { Store.importState(body.data); }
                finally {
                  setTimeout(() => { suppressAutoPush = Math.max(0, suppressAutoPush - 1); }, 0);
                }
                lastSyncedAt = Date.now();
                setMeta(remoteUpdated, lastSyncedAt);
                setStatus("ok");
              }
            });
            // If they cancel, leave local untouched. Next change pushes up.
            setStatus("ok");
            return;
          }
          // Local is at-or-newer than cloud — make sure cloud reflects it,
          // BUT never overwrite a populated cloud blob from a fresh device
          // (no local matches and no prior sync stamp = brand-new device).
          const localState = Store.getState();
          const localHasContent = (localState && localState.matches && localState.matches.length > 0);
          if (localUpdated > remoteUpdated && localHasContent) {
            await push();
            return;
          }
          if (localUpdated === 0 && !localHasContent) {
            // Fresh device — adopt the cloud copy silently.
            suppressAutoPush++;
            try { Store.importState(body.data); }
            finally {
              setTimeout(() => { suppressAutoPush = Math.max(0, suppressAutoPush - 1); }, 0);
            }
            lastSyncedAt = Date.now();
            setMeta(remoteUpdated, lastSyncedAt);
            setStatus("ok");
            return;
          }
          // Equal-ish — nothing to do.
          lastSyncedAt = Date.now();
          setMeta(remoteUpdated, lastSyncedAt);
          setStatus("ok");
        } catch (err) {
          setStatus("error", String(err.message || err));
        }
      }

      function copyCodeToClipboard(code) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code);
            return true;
          }
        } catch {}
        return false;
      }

      return {
        getCode, setCode, clearCode, isBound, generateCode,
        push, pull, scheduleAutoPush, bootSync, status,
        copyCodeToClipboard
      };
    })();

    /* ---------- Cloud API: passed to roster view for the sync card ------- */
    const cloudApi = {
      status: () => Cloud.status(),
      connect(code) {
        if (!/^\d{6}$/.test(code)) return { ok: false, error: "Code must be exactly 6 digits." };
        Cloud.setCode(code);
        Cloud.bootSync();
        return { ok: true };
      },
      disconnect() {
        Modal.confirm({
          title: "Disconnect cloud sync?",
          message: "This device will stop syncing. Local data is kept. You can reconnect later with the same code.",
          confirmLabel: "Disconnect",
          danger: true,
          onConfirm: () => { Cloud.clearCode(); render(); }
        });
      },
      pushNow() { Cloud.push().then(() => render()); },
      pullNow() {
        Modal.confirm({
          title: "Pull cloud copy?",
          message: "Replace this device's data with whatever is in the cloud right now. This can't be undone.",
          confirmLabel: "Pull & replace",
          danger: true,
          onConfirm: () => { Cloud.pull().then(() => render()); }
        });
      },
      generate() {
        const code = Cloud.generateCode();
        const copied = Cloud.copyCodeToClipboard(code);
        Cloud.setCode(code);
        Cloud.bootSync();
        return { code, copied };
      },
      copyCode() {
        const c = Cloud.getCode();
        if (!c) return false;
        return Cloud.copyCodeToClipboard(c);
      }
    };

    /* ---------- Form API (passed to Matches view) ---------- */
    const formApi = {
      get state() { return formState; },
      toggleForm() {
        formState.showForm = !formState.showForm;
        if (formState.showForm) {
          // Reset per-open so canceled drafts don't bleed across sessions.
          formState = newFormState();
          formState.showForm = true;
        }
        render();
      },
      cancel() {
        formState = newFormState();
        render();
      },
      setField(name, value) {
        formState[name] = value;
        recomputeFormErrors();
        // No render — see liveApi.setSetupField rationale (mobile keystroke focus loss).
      },
      toggleStarter(pid) {
        const idx = formState.starters.indexOf(pid);
        if (idx >= 0) {
          formState.starters.splice(idx, 1);
        } else {
          if (formState.starters.length >= STARTERS_COUNT) {
            // Replace oldest selection to keep cap at 5? Spec says count must be 5 to save;
            // we soft-block adding once 5 chosen.
            return;
          }
          formState.starters.push(pid);
        }
        // Drop subs that reference players not on roster (always true) — keep semantic check live.
        recomputeFormErrors();
        render();
      },
      addSub() {
        formState.subs.push({ off: "", on: "", minute: "", _key: uid("s") });
        recomputeFormErrors();
        render();
      },
      updateSub(key, field, value) {
        const sub = formState.subs.find(s => s._key === key);
        if (!sub) return;
        sub[field] = value;
        recomputeFormErrors();
        render();
      },
      removeSub(key) {
        formState.subs = formState.subs.filter(s => s._key !== key);
        recomputeFormErrors();
        render();
      },
      setStat(pid, field, value) {
        if (!formState.stats[pid]) formState.stats[pid] = { goals: 0, assists: 0, yellow: false, red: false };
        formState.stats[pid][field] = value;
        // No need to re-validate — stats don't gate save (besides goals being numeric, validated on submit).
        render();
      },
      submit() {
        const errs = recomputeFormErrors(/*forSubmit*/ true);
        if (errs.length > 0) { render(); return; }
        // Persist match.
        const f = formState;
        const matchLength = clampInt(f.matchLength, MIN_LENGTH, MAX_LENGTH, DEFAULT_LENGTH);
        // Sort subs by minute ascending for stored order (engine sorts defensively too).
        const subs = f.subs.map(s => ({
          off: s.off,
          on:  s.on,
          minute: clampInt(s.minute, 1, matchLength, 1)
        })).sort((a, b) => a.minute - b.minute);

        // Build stats only for appearing players, default goals=0, blanks→0.
        const appeared = new Set(f.starters);
        for (const s of subs) appeared.add(s.on);
        const stats = {};
        for (const pid of appeared) {
          const raw = f.stats[pid] || {};
          stats[pid] = {
            goals:   clampInt(raw.goals, 0, 999, 0),
            assists: clampInt(raw.assists, 0, 999, 0),
            yellow:  !!raw.yellow,
            red:     !!raw.red
          };
        }
        Store.addMatch({
          opponent:    f.opponent.trim(),
          date:        f.date,
          matchLength: matchLength,
          ourScore:    clampInt(f.ourScore, 0, 999, 0),
          theirScore:  clampInt(f.theirScore, 0, 999, 0),
          starters:    f.starters.slice(),
          subs:        subs,
          stats:       stats
        });
        formState = newFormState();
        render();
      },
      openMatch: openDetail
    };

    /* ---------- Live Match API ---------- */
    function recomputeLiveSetupErrors(forStart) {
      const f = liveSetup;
      const errs = [];
      if (forStart) {
        if (!f.opponent || !f.opponent.trim()) errs.push("Opponent is required.");
        if (!f.date) errs.push("Date is required.");
      }
      const mlNum = parseInt(f.matchLength, 10);
      if (!Number.isFinite(mlNum) || mlNum < MIN_LENGTH || mlNum > MAX_LENGTH) {
        errs.push(`Match length must be between ${MIN_LENGTH} and ${MAX_LENGTH}.`);
      }
      if (f.starters.length !== STARTERS_COUNT) {
        errs.push(`Pick exactly ${STARTERS_COUNT} starters (currently ${f.starters.length}).`);
      }
      f.errors = errs;
      return errs;
    }

    const liveApi = {
      get setup() { return liveSetup; },
      get picker() { return livePicker; },
      toggleSetup() {
        liveSetup = newLiveSetup();
        liveSetup.showForm = true;
        render();
      },
      cancelSetup() {
        liveSetup = newLiveSetup();
        render();
      },
      setSetupField(name, value) {
        liveSetup[name] = value;
        recomputeLiveSetupErrors();
        // No render — re-rendering the form on every keystroke destroys the
        // focused input on mobile and limits typing to one character per tap.
        // Errors surface on submit attempt; the DOM already reflects the typed value.
      },
      toggleStarter(pid) {
        const idx = liveSetup.starters.indexOf(pid);
        if (idx >= 0) liveSetup.starters.splice(idx, 1);
        else if (liveSetup.starters.length < STARTERS_COUNT) liveSetup.starters.push(pid);
        recomputeLiveSetupErrors();
        render();
      },
      start() {
        const errs = recomputeLiveSetupErrors(true);
        if (errs.length) { render(); return; }
        const f = liveSetup;
        Store.startLiveMatch({
          opponent:    f.opponent.trim(),
          date:        f.date,
          matchLength: clampInt(f.matchLength, MIN_LENGTH, MAX_LENGTH, DEFAULT_LENGTH),
          starters:    f.starters.slice()
        });
        liveSetup = newLiveSetup();
        livePicker = null;
        render();
      },
      pause:  () => { Store.pauseLive(); },
      resume: () => { Store.resumeLive(); },
      endMatch() {
        Modal.confirm({
          title: "End match and save?",
          message: "This stops the clock and saves the match record. Live data will be cleared.",
          confirmLabel: "End match",
          danger: false,
          onConfirm: () => {
            Store.endLiveMatch();
            livePicker = null;
            clearSubToast();
            render();
          }
        });
      },
      cancelLive() {
        Modal.confirm({
          title: "Cancel this live match?",
          message: "Discard the in-progress match without saving. This cannot be undone.",
          confirmLabel: "Discard",
          danger: true,
          onConfirm: () => {
            Store.cancelLiveMatch();
            livePicker = null;
            clearSubToast();
            render();
          }
        });
      },
      // Action button entry points — open a 1-step picker.
      beginGoalUs:   () => { livePicker = { kind: "goalUs",   step: "scorer", partial: {} }; render(); },
      beginGoalThem: () => { Store.appendLiveEvent({ kind: "goalThem" }); },
      beginSub:      () => { livePicker = { kind: "sub",      step: "off",    partial: {} }; render(); },
      beginCard:     () => { livePicker = { kind: "card",     step: "player", partial: {} }; render(); },
      cancelPicker:  () => { livePicker = null; render(); },
      pickPlayer(pid) {
        const lm = Store.getLive();
        if (!lm || !livePicker) return;
        const onPitch = Store.liveOnPitch();
        if (livePicker.kind === "goalUs") {
          if (livePicker.step === "scorer") {
            if (!onPitch.has(pid)) return; // scorer must be on-pitch
            livePicker.partial.scorer = pid;
            livePicker.step = "assist";
            render();
          } else if (livePicker.step === "assist") {
            const assistId = (pid === livePicker.partial.scorer) ? null : pid;
            Store.appendLiveEvent({ kind: "goalUs", scorer: livePicker.partial.scorer, assist: assistId });
            livePicker = null;
            render();
          }
        } else if (livePicker.kind === "sub") {
          if (livePicker.step === "off") {
            if (!onPitch.has(pid)) return;
            livePicker.partial.off = pid;
            livePicker.step = "on";
            render();
          } else if (livePicker.step === "on") {
            if (onPitch.has(pid)) return;       // must be currently on bench
            if (pid === livePicker.partial.off) return;
            const offId = livePicker.partial.off;
            const ev = Store.appendLiveEvent({ kind: "sub", off: offId, on: pid });
            if (ev) flashSubToast(ev.id, offId, pid);
            livePicker = null;
            render();
          }
        } else if (livePicker.kind === "card") {
          if (livePicker.step === "player") {
            livePicker.partial.player = pid;
            livePicker.step = "color";
            render();
          }
        }
      },
      pickCardColor(color) {
        if (!livePicker || livePicker.kind !== "card" || livePicker.step !== "color") return;
        const player = livePicker.partial.player;
        if (!player) { livePicker = null; render(); return; }
        Store.appendLiveEvent({ kind: color === "red" ? "red" : "yellow", player });
        livePicker = null;
        render();
      },
      skipAssist() {
        if (!livePicker || livePicker.kind !== "goalUs" || livePicker.step !== "assist") return;
        Store.appendLiveEvent({ kind: "goalUs", scorer: livePicker.partial.scorer, assist: null });
        livePicker = null;
        render();
      },
      undoEvent(id) {
        if (lastSubToast && lastSubToast.eventId === id) clearSubToast();
        Store.removeLiveEvent(id);
      },
      // Direct-tap sub: tap an on-pitch row to mark them coming off, then tap a bench row to bring on.
      directSubFromPitch(pid) {
        const lm = Store.getLive();
        if (!lm || lm.paused) return;
        const onPitch = Store.liveOnPitch();
        if (!onPitch.has(pid)) return;
        // If a non-sub picker is open, ignore direct-tap. Otherwise hijack it.
        if (livePicker && livePicker.kind !== "sub") return;
        livePicker = { kind: "sub", step: "on", partial: { off: pid } };
        render();
      },
      directSubFromBench(pid) {
        const lm = Store.getLive();
        if (!lm || lm.paused) return;
        if (!livePicker || livePicker.kind !== "sub" || livePicker.step !== "on") return;
        const offId = livePicker.partial.off;
        if (!offId || pid === offId) return;
        const ev = Store.appendLiveEvent({ kind: "sub", off: offId, on: pid });
        if (ev) flashSubToast(ev.id, offId, pid);
        livePicker = null;
        render();
      },
      undoLastSub() {
        if (!lastSubToast) return;
        const id = lastSubToast.eventId;
        clearSubToast();
        Store.removeLiveEvent(id);
      },
      get lastSubToast() { return lastSubToast; }
    };

    /**
     * Validate the in-progress form. Returns the array of error strings and
     * also writes them onto formState.errors. When `forSubmit` is true,
     * fields like opponent/scores are required; otherwise we soft-validate
     * only structural items so the user gets live feedback while editing.
     */
    function recomputeFormErrors(forSubmit) {
      const f = formState;
      const errs = [];
      if (forSubmit) {
        if (!f.opponent || !f.opponent.trim()) errs.push("Opponent is required.");
        if (!f.date) errs.push("Date is required.");
        if (f.ourScore === "" || f.ourScore === null) errs.push("Our score is required.");
        if (f.theirScore === "" || f.theirScore === null) errs.push("Opponent score is required.");
        if (f.ourScore !== "" && (parseInt(f.ourScore, 10) < 0 || !Number.isFinite(parseInt(f.ourScore, 10))))
          errs.push("Our score must be 0 or higher.");
        if (f.theirScore !== "" && (parseInt(f.theirScore, 10) < 0 || !Number.isFinite(parseInt(f.theirScore, 10))))
          errs.push("Opponent score must be 0 or higher.");
      }
      const mlNum = parseInt(f.matchLength, 10);
      if (!Number.isFinite(mlNum) || mlNum < MIN_LENGTH || mlNum > MAX_LENGTH) {
        errs.push(`Match length must be between ${MIN_LENGTH} and ${MAX_LENGTH}.`);
      }
      if (f.starters.length !== STARTERS_COUNT) {
        errs.push(`Pick exactly ${STARTERS_COUNT} starters (currently ${f.starters.length}).`);
      }

      // Walk subs in minute order. Each sub must be valid against the on-pitch
      // state established by all prior subs at the same or earlier minute.
      const ml = Number.isFinite(mlNum) ? mlNum : MAX_LENGTH;
      const onPitch = new Set(f.starters);
      const onBench = new Set(Store.getState().players.map(p => p.id).filter(id => !onPitch.has(id)));
      const ordered = f.subs.slice().sort((a, b) => {
        const am = parseInt(a.minute, 10), bm = parseInt(b.minute, 10);
        if (Number.isFinite(am) && Number.isFinite(bm)) return am - bm;
        if (Number.isFinite(am)) return -1;
        if (Number.isFinite(bm)) return 1;
        return 0;
      });
      // We tag each sub with a per-sub error message.
      const subErrors = new Map();
      for (let i = 0; i < ordered.length; i++) {
        const s = ordered[i];
        const m = parseInt(s.minute, 10);
        const local = [];
        if (!s.off) local.push("Pick player coming off.");
        if (!s.on)  local.push("Pick player coming on.");
        if (!Number.isFinite(m) || m < 1 || m > ml) local.push(`Minute must be 1–${ml}.`);
        if (s.off && !onPitch.has(s.off)) local.push("Player off must be on the pitch at this point.");
        if (s.on && !onBench.has(s.on))  local.push("Player on must be on the bench at this point.");
        if (s.off && s.on && s.off === s.on) local.push("Off and on must differ.");
        if (local.length) subErrors.set(s._key, local.join(" "));
