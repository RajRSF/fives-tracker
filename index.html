        // Apply transition so subsequent subs validate against new state.
        if (s.off && onPitch.has(s.off)) { onPitch.delete(s.off); onBench.add(s.off); }
        if (s.on && onBench.has(s.on))   { onBench.delete(s.on); onPitch.add(s.on); }
      }
      f._subErrors = subErrors;
      if (subErrors.size > 0) errs.push("Fix substitution rows highlighted in red.");

      f.errors = errs;
      return errs;
    }

    return { init, render, setTab, get liveApi() { return liveApi; } };
  })();

  /* =========================================================================
   * Modal — simple confirm dialog
   * ======================================================================= */
  const Modal = (function () {
    const root = $("#modal-root");
    function close() { root.innerHTML = ""; }
    function confirm(opts) {
      close();
      const backdrop = el("div", { class: "modal-backdrop", onClick: (e) => {
        if (e.target === backdrop) close();
      }}, [
        el("div", { class: "modal", role: "dialog", "aria-modal": "true" }, [
          el("h3", null, opts.title || "Confirm"),
          el("p", { class: "muted" }, opts.message || ""),
          el("div", { class: "actions" }, [
            el("button", { class: "btn", onClick: close }, "Cancel"),
            el("button", {
              class: "btn " + (opts.danger ? "btn-danger" : "btn-primary"),
              onClick: () => { close(); if (opts.onConfirm) opts.onConfirm(); }
            }, opts.confirmLabel || "Confirm")
          ])
        ])
      ]);
      root.appendChild(backdrop);
    }
    return { confirm, close };
  })();

  /* =========================================================================
   * Render — view modules
   * ======================================================================= */
  const Render = (function () {

    /* ---------- Live banner (shown on every non-Matches tab while a live match runs) ---------- */
    function renderLiveBanner(root) {
      const lm = Store.getLive();
      if (!lm) return;
      const elapsedMs = Store.liveElapsedMs();
      let ourScore = 0, theirScore = 0;
      for (const e of lm.events) {
        if (e.kind === "goalUs") ourScore++;
        else if (e.kind === "goalThem") theirScore++;
      }
      const banner = el("div", { class: "live-banner" }, [
        el("span", { class: "dot" }),
        el("div", { class: "grow" }, [
          el("div", { class: "scoreboard" }, fmtClock(elapsedMs) + "  ·  " + ourScore + " – " + theirScore),
          el("div", { class: "muted-on-pitch" }, "Live: vs " + (lm.opponent || "(opponent)") + (lm.paused ? " · paused" : ""))
        ]),
        el("button", { class: "btn", onClick: () => App.setTab("matches") }, "Open")
      ]);
      root.appendChild(banner);
    }

    /* ---------- Cloud sync card (Roster tab) ---------- */
    function renderCloudCard(root, cloudApi) {
      if (!cloudApi) return;
      const st = cloudApi.status();
      const card = el("section", { class: "card" });
      const headRow = el("div", { class: "row" }, [
        el("div", { class: "grow" }, [
          el("h2", null, "Cloud sync"),
          el("p", { class: "muted" },
            st.bound
              ? "Connected. Stats sync to every device using this code."
              : "Type a 6-digit code on every device to share stats. Lose your phone, the data lives on.")
        ]),
        el("span", {
          class: "cloud-status " + (st.bound ? (st.status === "syncing" ? "syncing" : (st.status === "error" ? "error" : "bound")) : "unbound")
        }, st.bound ? (st.status === "syncing" ? "Syncing" : (st.status === "error" ? "Error" : "Linked")) : "Off")
      ]);
      card.appendChild(headRow);

      if (!st.bound) {
        // Not yet connected — show input + Generate.
        const draft = { code: "" };
        const codeInput = el("input", {
          type: "text",
          inputmode: "numeric",
          pattern: "\\d{6}",
          maxLength: 6,
          autocomplete: "off",
          placeholder: "123456",
          class: "cloud-code-input",
          "aria-label": "6-digit sync code",
          onInput: (e) => {
            const v = (e.target.value || "").replace(/\D/g, "").slice(0, 6);
            e.target.value = v;
            draft.code = v;
            connectBtn.disabled = v.length !== 6;
          }
        });
        const connectBtn = el("button", {
          class: "btn btn-primary btn-block",
          disabled: true,
          onClick: () => {
            const r = cloudApi.connect(draft.code);
            if (!r.ok) {
              Modal.confirm({ title: "Couldn't connect", message: r.error || "Try again.", confirmLabel: "OK", onConfirm: () => {} });
              return;
            }
            render();
          }
        }, "Connect");
        const generateBtn = el("button", {
          class: "btn btn-block",
          onClick: () => {
            const r = cloudApi.generate();
            Modal.confirm({
              title: "New sync code",
              message: "Your code is " + r.code + (r.copied ? " — copied to clipboard." : ".") +
                "\n\nUse the same code on any other device to share stats.",
              confirmLabel: "Got it",
              onConfirm: () => { render(); }
            });
          }
        }, "Generate new code");
        card.appendChild(el("div", { class: "field" }, [
          el("label", null, "Sync code"),
          codeInput
        ]));
        card.appendChild(el("div", { class: "row settings-actions" }, [
          connectBtn,
          generateBtn
        ]));
        if (st.status === "error" && st.error) {
          card.appendChild(el("p", { class: "muted small" }, "Last error: " + st.error));
        }
      } else {
        const masked = st.code.slice(0, 3) + " " + st.code.slice(3);
        card.appendChild(el("div", { class: "row" }, [
          el("div", { class: "grow" }, [
            el("div", { class: "muted small" }, "Code"),
            el("div", { class: "cloud-code-display" }, masked)
          ]),
          el("button", {
            class: "btn btn-sm",
            onClick: () => {
              const ok = cloudApi.copyCode();
              Modal.confirm({
                title: ok ? "Code copied" : "Code",
                message: ok ? ("Sync code " + st.code + " copied to clipboard.")
                            : ("Sync code: " + st.code),
                confirmLabel: "OK",
                onConfirm: () => {}
              });
            }
          }, "Copy")
        ]));
        card.appendChild(el("div", { class: "row settings-actions" }, [
          el("button", { class: "btn btn-block", onClick: () => cloudApi.pushNow() }, "↑ Push now"),
          el("button", { class: "btn btn-block", onClick: () => cloudApi.pullNow() }, "↓ Pull from cloud")
        ]));
        card.appendChild(el("div", { class: "row settings-actions" }, [
          el("button", { class: "btn btn-block", onClick: () => cloudApi.disconnect() }, "Disconnect")
        ]));
        const stamp = st.lastSyncedAt ? new Date(st.lastSyncedAt).toLocaleTimeString() : "—";
        const summary = "Last synced: " + stamp +
          (st.status === "error" ? (" · error: " + st.error) : "");
        card.appendChild(el("p", { class: "muted small" }, summary));
      }
      root.appendChild(card);
    }

    /* ---------- Roster ---------- */
    function renderRoster(root, dataApi, cloudApi) {
      renderLiveBanner(root);
      const s = Store.getState();
      const card = el("section", { class: "card" }, [
        el("h2", null, "Squad"),
        el("p", { class: "muted" }, `${SQUAD_SIZE} players. Tap a name to rename — changes save automatically.`)
      ]);
      const list = el("div", null);
      s.players.forEach((p, idx) => {
        const input = el("input", {
          type: "text",
          value: p.name,
          maxLength: 40,
          "aria-label": `Player ${idx + 1} name`,
          onChange: (e) => {
            Store.updatePlayerName(p.id, e.target.value);
          },
          onBlur: (e) => {
            // Blur also commits in case change didn't fire (e.g., same value).
            if (e.target.value.trim() && e.target.value.trim() !== p.name) {
              Store.updatePlayerName(p.id, e.target.value);
            }
          },
          onKeyDown: (e) => { if (e.key === "Enter") e.target.blur(); }
        });
        list.appendChild(el("div", { class: "player-row" }, [
          el("span", { class: "player-badge" }, String(idx + 1)),
          el("span", { class: "pinitial sm", "aria-hidden": "true" }, initialsOf(p.name)),
          el("div", { class: "grow" }, input)
        ]));
      });
      card.appendChild(list);
      root.appendChild(card);

      renderCloudCard(root, cloudApi);

      if (dataApi) {
        const settingsCard = el("section", { class: "card" }, [
          el("h2", null, "Backup & restore"),
          el("p", { class: "muted" },
            "Data lives only in this browser. Export to keep a copy off-device — bring it back any time with Import.")
        ]);
        settingsCard.appendChild(el("div", { class: "row settings-actions" }, [
          el("button", { class: "btn btn-block", onClick: () => dataApi.exportData() }, "⬇ Export JSON"),
          el("button", { class: "btn btn-block", onClick: () => dataApi.pickImportFile() }, "⬆ Import JSON")
        ]));
        const lastMatch = s.matches.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0))[0];
        const summary = `${s.matches.length} match${s.matches.length === 1 ? "" : "es"} · ${s.players.length} players` +
          (lastMatch ? ` · last vs ${lastMatch.opponent}` : "");
        settingsCard.appendChild(el("p", { class: "muted small" }, summary));
        root.appendChild(settingsCard);
      }
    }

    /* ---------- Matches list + form ---------- */
    function renderMatches(root, formState, api, liveSetup, liveApi) {
      const s = Store.getState();

      // Live setup card (when no live match running)
      const liveCard = el("section", { class: "card" });
      const liveHeader = el("div", { class: "row" }, [
        el("div", { class: "grow" }, [
          el("h2", null, "Live Match"),
          el("p", { class: "muted" }, liveSetup.showForm
            ? "Pick 5 starters, then hit Start. The clock runs from minute 0."
            : "Track a match in real time — clock, goals, subs, and cards as they happen.")
        ]),
        el("button", {
          class: "btn " + (liveSetup.showForm ? "" : "btn-primary"),
          onClick: () => liveApi.toggleSetup()
        }, liveSetup.showForm ? "Close" : "+ Start Live Match")
      ]);
      liveCard.appendChild(liveHeader);
      if (liveSetup.showForm) renderLiveSetupForm(liveCard, liveSetup, liveApi);
      root.appendChild(liveCard);

      // Legacy "Log past match" — collapsed disclosure for backfill.
      const formCard = el("section", { class: "card" });
      const det = el("details", { class: "past-match-disclosure" });
      const sum = el("summary", null, formState.showForm ? "Log past match (open)" : "Log past match (backfill)");
      det.appendChild(sum);
      if (formState.showForm) det.setAttribute("open", "");
      const formHost = el("div", { class: "stack" });
      formHost.appendChild(el("p", { class: "muted" }, "For matches you didn't track live — enter opponent, score, lineup, subs, and stats."));
      const toggleRow = el("div", { class: "row" }, [
        el("div", { class: "grow" }),
        el("button", {
          class: "btn " + (formState.showForm ? "" : "btn-primary"),
          onClick: () => api.toggleForm()
        }, formState.showForm ? "Close form" : "Open form")
      ]);
      formHost.appendChild(toggleRow);
      if (formState.showForm) renderNewMatchForm(formHost, formState, api);
      det.appendChild(formHost);
      formCard.appendChild(det);
      root.appendChild(formCard);

      // Saved matches
      const histCard = el("section", { class: "card" }, [
        el("h2", null, "Saved Matches")
      ]);
      if (s.matches.length === 0) {
        histCard.appendChild(el("p", { class: "empty" }, "No matches yet. Log your first one above."));
      } else {
        const sorted = s.matches.slice().sort((a, b) => {
          // Newest first — by date desc, ties broken by createdAt desc.
          if (a.date !== b.date) return a.date < b.date ? 1 : -1;
          return (a.createdAt < b.createdAt) ? 1 : -1;
        });
        for (const m of sorted) histCard.appendChild(renderMatchRow(m, api));
      }
      root.appendChild(histCard);
    }

    function resultOf(match) {
      if (match.ourScore > match.theirScore) return "W";
      if (match.ourScore < match.theirScore) return "L";
      return "D";
    }

    function renderMatchRow(m, api) {
      const r = resultOf(m);
      return el("div", {
        class: "match-card",
        role: "button",
        tabindex: "0",
        onClick: () => api.openMatch(m.id),
        onKeyDown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); api.openMatch(m.id); } }
      }, [
        el("div", null, [
          el("div", { class: "opp" }, ["vs ", m.opponent || "(no opponent)"]),
          el("div", { class: "when" }, [fmtDate(m.date), "  ·  ", el("span", { class: "pill " + r }, r)])
        ]),
        el("div", { class: "score scoreboard" }, `${m.ourScore} – ${m.theirScore}`)
      ]);
    }

          })
        ]),
        el("div", { class: "field-row" }, [
          el("div", { class: "field" }, [
            el("label", { for: "f-date" }, "Date"),
            el("input", { id: "f-date", type: "date", value: f.date,

          ]),
          el("div", { class: "field" }, [
            el("label", { for: "f-len" }, `Match length (${MIN_LENGTH}–${MAX_LENGTH} min)`),
            el("input", {
              id: "f-len", type: "number", min: MIN_LENGTH, max: MAX_LENGTH, step: 1,
              value: f.matchLength,
              onInput: (e) => api.setField("matchLength", e.target.value)
            })
          ])
        ]),
        el("div", { class: "field" }, [
          el("label", null, "Score"),
          el("div", { class: "score-inline" }, [
            el("input", {
              type: "number", min: 0, step: 1, value: f.ourScore,

              onInput: (e) => api.setField("ourScore", e.target.value)
            }),
            el("div", { class: "dash" }, "–"),
            el("input", {

            })
          ])

      const pickerCard = el("div", { class: "field" }, [

        ])
      ]);
      const picker = el("div", { class: "picker" });
      players.forEach((p, idx) => {

        picker.appendChild(el("div", {
          class: "pick-row" + (isStarter ? " starter" : ""),

          onKeyDown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); api.toggleStarter(p.id); } },
          role: "button", tabindex: "0",
          "aria-pressed": isStarter ? "true" : "false"
        }, [

      root.appendChild(subsCard);

      // Per-player stats — for everyone who appeared.
      const appeared = new Set(f.starters);
      for (const s of f.subs) if (s.on) appeared.add(s.on);
      const statsCard = el("div", { class: "field" }, [
        el("div", { class: "picker-meta" }, [el("span", null, "Per-player stats")]),

      ]);
      if (appeared.size === 0) {

      } else {
        const list = el("div");
        const orderedIds = players.map(p => p.id).filter(id => appeared.has(id));
        for (const pid of orderedIds) {
          const player = Store.getPlayer(pid);
          const cur = f.stats[pid] || { goals: 0, assists: 0, yellow: false, red: false };
          const goalsInput = el("input", {

          });

          });

            class: "toggle yellow" + (cur.yellow ? " on" : ""),

    /* ---------- Dashboard ---------- */
    function renderDashboard(root, sort, setSort) {
      renderLiveBanner(root);
      const s = Store.getState();
      const totals = new Map();
      for (const p of s.players) {
        totals.set(p.id, { id: p.id, matches: 0, minutes: 0, goals: 0, assists: 0 });
      }
      for (const m of s.matches) {
        const minutes = MinutesEngine.computeMinutesByPlayer(m.starters, m.subs, m.matchLength);
        const appeared = MinutesEngine.summariseAppearances(m);
        for (const p of s.players) {
          const t = totals.get(p.id);
          const min = minutes.get(p.id) || 0;
          // matches-played counts iff player accrued >0 minutes (i.e. truly appeared).
          if (appeared.has(p.id) && min > 0) t.matches += 1;
          t.minutes += min;
          const st = m.stats[p.id];
          if (st) {
            t.goals   += (st.goals   || 0);
            t.assists += (st.assists || 0);
          }
        }
      }

      const rows = s.players.map(p => Object.assign({ name: p.name }, totals.get(p.id)));

      const cmp = (a, b) => {
        const dir = sort.dir === "asc" ? 1 : -1;
        let av, bv;
        switch (sort.col) {
          case "name":    av = a.name.toLowerCase(); bv = b.name.toLowerCase(); break;
          case "matches": av = a.matches; bv = b.matches; break;
          case "minutes": av = a.minutes; bv = b.minutes; break;
          case "goals":   av = a.goals;   bv = b.goals;   break;
          case "assists": av = a.assists; bv = b.assists; break;
          default:        av = a.minutes; bv = b.minutes;
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return  1 * dir;
        // Tie-break by name asc for stability
        return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
      };
      rows.sort(cmp);

      const arrow = (col) => sort.col === col ? (sort.dir === "asc" ? "▲" : "▼") : "";
      const card = el("section", { class: "card" }, [
        el("h2", null, "Player Dashboard"),
        el("p", { class: "muted" }, "Totals derive live from saved matches. Tap a column to sort.")
      ]);
      const tbl = el("table", { class: "dash" }, [
        el("thead", null, [
          el("tr", null, [
            el("th", { onClick: () => setSort("name") },    ["Player ",  el("span", { class: "arrow" }, arrow("name"))]),
            el("th", { class: "num", onClick: () => setSort("matches") }, [el("span", { class: "arrow" }, arrow("matches")), " MP"]),
            el("th", { class: "num", onClick: () => setSort("minutes") }, [el("span", { class: "arrow" }, arrow("minutes")), " Min"]),
            el("th", { class: "num", onClick: () => setSort("goals") },   [el("span", { class: "arrow" }, arrow("goals")),   " G"]),
            el("th", { class: "num", onClick: () => setSort("assists") }, [el("span", { class: "arrow" }, arrow("assists")), " A"])
          ])
        ]),
        el("tbody", null, rows.map(r => el("tr", null, [
          el("td", null, r.name),
          el("td", { class: "num" }, String(r.matches)),
          el("td", { class: "num" }, String(r.minutes)),
          el("td", { class: "num" }, String(r.goals)),
          el("td", { class: "num" }, String(r.assists))
        ])))
      ]);
      card.appendChild(tbl);
      if (s.matches.length === 0) {
        card.appendChild(el("p", { class: "empty" },
          "No matches logged yet. Add a match in the Matches tab to see totals here."));
      }
      root.appendChild(card);
    }

    function fmtClock(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    /**
     * Live milliseconds-played per player at the current moment.
     * Walks sub events at their precise atMs (elapsed-ms when the sub fired),
     * not the integer subMinute used by the saved-record engine. This keeps
     * the on-pitch ticker accurate even when subs happen mid-minute.
     */
    function liveMillisecondsByPlayer() {
      const lm = Store.getLive();
      if (!lm) return new Map();
      // No planned-length cap — the clock runs until end-match.
      // liveElapsedMs already enforces the MAX_LENGTH hard ceiling.
      const elapsedMs = Store.liveElapsedMs();
      const subs = lm.events
        .filter(e => e.kind === "sub")
        .map(e => ({ off: e.off, on: e.on, atMs: Number.isFinite(e.atMs) ? e.atMs : (e.subMinute || 0) * 60000 }))
        .sort((a, b) => a.atMs - b.atMs);

      const ms = new Map();
      const stintStart = new Map(); // pid → ms-into-match when current stint started
      for (const pid of lm.starters) { stintStart.set(pid, 0); ms.set(pid, 0); }

      for (const s of subs) {
        if (s.atMs > elapsedMs) break;
        if (stintStart.has(s.off)) {
          const start = stintStart.get(s.off);
          ms.set(s.off, (ms.get(s.off) || 0) + Math.max(0, s.atMs - start));
          stintStart.delete(s.off);
        }
        stintStart.set(s.on, s.atMs);
        if (!ms.has(s.on)) ms.set(s.on, 0);
      }
      for (const [pid, start] of stintStart.entries()) {
        ms.set(pid, (ms.get(pid) || 0) + Math.max(0, elapsedMs - start));
      }
      return ms;
    }

    /* ---------- Live match view ---------- */
    function renderLiveMatch(root, picker, api) {
      const lm = Store.getLive();
      if (!lm) return;
      const elapsedMs = Store.liveElapsedMs();

      // Tally goals from events for the scoreline.
      let ourScore = 0, theirScore = 0;
      for (const e of lm.events) {
        if (e.kind === "goalUs") ourScore++;
        else if (e.kind === "goalThem") theirScore++;
      }

      // HUD
      const hud = el("section", { class: "live-hud" }, [
        el("div", { class: "opp-line" }, [
          el("span", { class: "opp" }, "vs " + (lm.opponent || "(opponent)")),
          el("span", { class: "status" }, lm.paused ? "Paused" : "Live")
        ]),
        el("div", { class: "scoreline" }, [
          el("div", { class: "side" }, [
            el("div", { class: "label" }, OUR_TEAM_NAME),
            el("div", { class: "val" }, String(ourScore))
          ]),
          el("div", { class: "clock" }, fmtClock(elapsedMs)),
          el("div", { class: "side" }, [
            el("div", { class: "label" }, lm.opponent || "Opponent"),
            el("div", { class: "val" }, String(theirScore))
          ])
        ]),
        el("div", { class: "clock-row" }, [
          (lm.paused
            ? el("button", { class: "btn btn-resume", onClick: () => api.resume() }, "▶ Resume")
            : el("button", { class: "btn btn-pause",  onClick: () => api.pause()  }, "⏸ Pause")),
          el("button", { class: "btn btn-end", onClick: () => api.endMatch() }, "End match")
        ])
      ]);
      root.appendChild(hud);

      // Action buttons (or picker if one is active)
      if (picker) {
        root.appendChild(renderLivePicker(picker, api));
      } else {
        const actions = el("div", { class: "live-actions" }, [
          el("button", { class: "btn btn-goal-us",   onClick: () => api.beginGoalUs()   }, "⚽ Goal — Us"),
          el("button", { class: "btn btn-goal-them", onClick: () => api.beginGoalThem() }, "Goal — Them"),
          el("button", { class: "btn btn-sub",       onClick: () => api.beginSub()      }, "↔ Sub"),
          el("button", { class: "btn btn-card",      onClick: () => api.beginCard()     }, "🟨 Card")
        ]);
        root.appendChild(actions);
      }

      // Live roster
      const players = Store.getState().players;
      const onPitch = Store.liveOnPitch();
      const playMs = liveMillisecondsByPlayer();
      const stats = computeLiveStats(lm);

      const subPicking = !!(picker && picker.kind === "sub" && picker.step === "on");
      const preselectedOff = subPicking ? picker.partial.off : null;
      const directSubsAvailable = !lm.paused;

      const onPitchCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "On the pitch (" + onPitch.size + ")")
      ]);
      if (directSubsAvailable && !picker) {
        onPitchCard.appendChild(el("p", { class: "muted live-hint" },
          "Tap a player on the pitch to start a sub."));
      } else if (subPicking) {
        onPitchCard.appendChild(el("p", { class: "muted live-hint" },
          "Pick a bench player below to bring on, or tap another on-pitch player to swap who's coming off."));
      }
      const onPitchGrid = el("div", { class: "live-roster-grid" });
      players.filter(p => onPitch.has(p.id)).forEach((p, i) => {
        const tappable = directSubsAvailable && (!picker || subPicking);
        const preselected = preselectedOff === p.id;
        onPitchGrid.appendChild(buildLiveRow(p, i + 1, playMs.get(p.id) || 0, stats[p.id], "on-pitch", {
          tappable,
          preselected,
          onClick: tappable ? () => api.directSubFromPitch(p.id) : null
        }));
      });
      onPitchCard.appendChild(onPitchGrid);
      root.appendChild(onPitchCard);

      const benchCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "Bench")
      ]);
      const benchGrid = el("div", { class: "live-roster-grid" });
      players.filter(p => !onPitch.has(p.id)).forEach((p) => {
        const armed = subPicking && directSubsAvailable;
        benchGrid.appendChild(buildLiveRow(p, "B", playMs.get(p.id) || 0, stats[p.id], "on-bench", {
          tappable: armed,
          armed,
          onClick: armed ? () => api.directSubFromBench(p.id) : null
        }));
      });
      benchCard.appendChild(benchGrid);
      root.appendChild(benchCard);

      // Undo toast — sticky at bottom for 5s after a sub commits.
      if (lastSubToast) {
        const offName = Store.playerName(lastSubToast.offId);
        const onName  = Store.playerName(lastSubToast.onId);
        root.appendChild(el("div", { class: "sub-toast", role: "status" }, [
          el("span", { class: "sub-toast-text" }, "Sub: " + offName + " → " + onName),
          el("button", { class: "btn btn-sm sub-toast-undo", onClick: () => { api.undoLastSub(); render(); } }, "Undo")
        ]));
      }

      // Events log
      const eventsCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "Events"),
      ]);
      if (lm.events.length === 0) {
        eventsCard.appendChild(el("p", { class: "empty" }, "No events yet."));
      } else {
        const list = el("div", { class: "live-events" });
        lm.events.slice().reverse().forEach(ev => list.appendChild(buildEventRow(ev, api)));
        eventsCard.appendChild(list);
      }
      root.appendChild(eventsCard);

      // Cancel link
      root.appendChild(el("div", { class: "row" }, [
        el("button", { class: "btn btn-danger", onClick: () => api.cancelLive() }, "Discard live match")
      ]));
    }

    function computeLiveStats(lm) {
      const stats = {};
      for (const pid of lm.starters) stats[pid] = { goals: 0, assists: 0, yellow: false, red: false };
      for (const e of lm.events) {
        if (e.kind === "sub" && e.on) stats[e.on] = stats[e.on] || { goals: 0, assists: 0, yellow: false, red: false };
        if (e.kind === "goalUs") {
          if (e.scorer) { stats[e.scorer] = stats[e.scorer] || { goals: 0, assists: 0, yellow: false, red: false }; stats[e.scorer].goals++; }
          if (e.assist) { stats[e.assist] = stats[e.assist] || { goals: 0, assists: 0, yellow: false, red: false }; stats[e.assist].assists++; }
        } else if (e.kind === "yellow" && e.player) {
          stats[e.player] = stats[e.player] || { goals: 0, assists: 0, yellow: false, red: false };
          stats[e.player].yellow = true;
        } else if (e.kind === "red" && e.player) {
          stats[e.player] = stats[e.player] || { goals: 0, assists: 0, yellow: false, red: false };
          stats[e.player].red = true;
        }
      }
      return stats;
    }

    function buildLiveRow(p, badge, playedMs, st, klass, opts) {
      const meta = el("div", { class: "pmeta" });
      if (st && st.goals)   meta.appendChild(el("span", { class: "pchip goal"   }, st.goals + "⚽"));
      if (st && st.assists) meta.appendChild(el("span", { class: "pchip assist" }, st.assists + "🅰"));
      if (st && st.yellow)  meta.appendChild(el("span", { class: "pchip yellow" }, "🟨"));
      if (st && st.red)     meta.appendChild(el("span", { class: "pchip red"    }, "🟥"));
      const o = opts || {};
      const initialsKlass = "pinitial sm " + (klass === "on-pitch" ? "starter" : "bench");
      const cls =
        "live-row " + klass +
        (o.tappable ? " tappable" : "") +
        (o.preselected ? " preselected" : "") +
        (o.armed ? " armed" : "");
      const attrs = { class: cls };
      if (o.onClick) {
        attrs.role = "button";
        attrs.tabindex = "0";
        attrs.onClick = o.onClick;
        attrs.onKeyDown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); o.onClick(); } };
      }
      return el("div", attrs, [
        el("span", { class: "pos" }, String(badge)),
        el("span", { class: initialsKlass, "aria-hidden": "true" }, initialsOf(p.name)),
        el("span", { class: "pname" }, p.name),
        meta,
        el("span", { class: "ptime scoreboard" }, fmtClock(playedMs))
      ]);
    }

    function buildEventRow(ev, api) {
      const minLabel = (ev.minute || 0) + "′";
      let text = "";
      let klass = "kind-" + ev.kind;
      if (ev.kind === "goalUs") {
        const s = ev.scorer ? Store.playerName(ev.scorer) : "(unknown)";
        text = "Goal: " + s + (ev.assist ? " (a: " + Store.playerName(ev.assist) + ")" : "");
      } else if (ev.kind === "goalThem") {
        text = "Goal — opposition";
      } else if (ev.kind === "sub") {
        text = "Sub: " + Store.playerName(ev.off) + " → " + Store.playerName(ev.on);
      } else if (ev.kind === "yellow") {
        text = "Yellow card: " + Store.playerName(ev.player);
      } else if (ev.kind === "red") {
        text = "Red card: " + Store.playerName(ev.player);
      } else {
        text = ev.kind;
      }
      return el("div", { class: "live-event " + klass }, [
        el("span", { class: "e-time" }, minLabel),
        el("span", { class: "e-text" }, text),
        el("button", { class: "e-undo", onClick: () => api.undoEvent(ev.id) }, "undo")
      ]);
    }

    function renderLivePicker(picker, api) {
      const lm = Store.getLive();
      const players = Store.getState().players;
      const onPitch = Store.liveOnPitch();

      let title = "";
      let pool = [];
      let canSkip = false;
      if (picker.kind === "goalUs" && picker.step === "scorer") {
        title = "Who scored?";
        pool = players.filter(p => onPitch.has(p.id));
      } else if (picker.kind === "goalUs" && picker.step === "assist") {
        title = "Assist? (or skip)";
        pool = players.filter(p => onPitch.has(p.id));
        canSkip = true;
      } else if (picker.kind === "sub" && picker.step === "off") {
        title = "Who's coming off?";
        pool = players.filter(p => onPitch.has(p.id));
      } else if (picker.kind === "sub" && picker.step === "on") {
        title = "Who's coming on?";
        pool = players.filter(p => !onPitch.has(p.id));
      } else if (picker.kind === "card" && picker.step === "player") {
        title = "Card — which player?";
        pool = players;
      } else if (picker.kind === "card" && picker.step === "color") {
        title = "Yellow or red?";
      }

      const card = el("section", { class: "card" }, [
        el("div", { class: "row" }, [
          el("h3", { class: "grow" }, title),
          el("button", { class: "btn", onClick: () => api.cancelPicker() }, "Cancel")
        ])
      ]);

      if (picker.kind === "card" && picker.step === "color") {
        card.appendChild(el("div", { class: "live-actions" }, [
          el("button", { class: "btn btn-card", onClick: () => api.pickCardColor("yellow") }, "🟨 Yellow"),
          el("button", { class: "btn btn-goal-them", onClick: () => api.pickCardColor("red") }, "🟥 Red")
        ]));
        return card;
      }

      const grid = el("div", { class: "picker live-picker" });
      pool.forEach(p => {
        grid.appendChild(el("button", {
          type: "button",
          class: "pick-row",
          onClick: () => api.pickPlayer(p.id)
        }, [
          el("span", { class: "pinitial sm", "aria-hidden": "true" }, initialsOf(p.name)),
          el("span", { class: "grow" }, p.name)
        ]));
      });
      card.appendChild(grid);
      if (canSkip) {
        card.appendChild(el("div", { class: "row" }, [
          el("button", { class: "btn", onClick: () => api.skipAssist() }, "No assist (skip)")
        ]));
      }
      return card;
    }

    return {
      renderRoster, renderMatches, renderDashboard, renderMatchDetail,
      renderLiveMatch
    };
  })();

  /* =========================================================================
   * Boot
   * ======================================================================= */
  document.addEventListener("DOMContentLoaded", App.init);

})();
</script>
</body>
</html>
