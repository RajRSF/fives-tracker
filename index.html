          }, [
            el("option", { value: "" }, "— off —"),
            ...players.map(p => el("option", { value: p.id, selected: s.off === p.id }, p.name))
          ]);
          const onSel = el("select", {
            "aria-label": "Player coming on",
            onChange: (e) => api.updateSub(s._key, "on", e.target.value)
          }, [
            el("option", { value: "" }, "— on —"),
            ...players.map(p => el("option", { value: p.id, selected: s.on === p.id }, p.name))
          ]);
          const minInput = el("input", {
            type: "number", min: 1, max: f.matchLength || MAX_LENGTH, step: 1,
            value: s.minute, "aria-label": "Minute",
            onInput: (e) => api.updateSub(s._key, "minute", e.target.value)
          });
          const row = el("div", null, [
            el("div", { class: "sub-row" }, [
              el("div", null, [el("label", null, "Off"), offSel]),
              el("div", null, [el("label", null, "On"), onSel]),
              el("div", null, [el("label", null, "Min"), minInput]),
              el("button", {
                class: "btn btn-sm btn-danger remove",
                onClick: () => api.removeSub(s._key),
                "aria-label": "Remove sub"
              }, "×")
            ])
          ]);
          if (subErrors.has(s._key)) {
            row.appendChild(el("div", { class: "err" }, subErrors.get(s._key)));
          }
          subsList.appendChild(row);
        }
        subsCard.appendChild(subsList);
      }
      root.appendChild(subsCard);

      // Per-player stats — for everyone who appeared.
      const appeared = new Set(f.starters);
      for (const s of f.subs) if (s.on) appeared.add(s.on);

      // Goalie shifts (optional). Each shift = { playerId, fromMin, toMin }.
      // Player pool is the appearing set; toMin blank means "to full time".
      const goalieCard = el("div", { class: "field" }, [
        el("div", { class: "picker-meta" }, [
          el("span", null, "🧤 Goalie shifts"),
          el("button", { class: "btn btn-sm", onClick: () => api.addGoalieShift() }, "+ Add shift")
        ]),
        el("p", { class: "muted" }, "Optional. Time in goal is subtracted from playing minutes for that player. Leave \"To\" blank to mean \"until full time\".")
      ]);
      if (!f.goalieShifts || f.goalieShifts.length === 0) {
        goalieCard.appendChild(el("p", { class: "muted" }, "No goalie shifts logged."));
      } else {
        const list = el("div");
        const appearingPlayers = players.filter(p => appeared.has(p.id));
        for (const g of f.goalieShifts) {
          const playerSel = el("select", {
            "aria-label": "Goalie",
            onChange: (e) => api.updateGoalieShift(g._key, "playerId", e.target.value)
          }, [
            el("option", { value: "" }, "— player —"),
            ...appearingPlayers.map(p => el("option", { value: p.id, selected: g.playerId === p.id }, p.name))
          ]);
          const fromInput = el("input", {
            type: "number", min: 0, max: f.matchLength || MAX_LENGTH, step: 1,
            value: g.fromMin, "aria-label": "Goalie from minute",
            onInput: (e) => api.updateGoalieShift(g._key, "fromMin", e.target.value)
          });
          const toInput = el("input", {
            type: "number", min: 0, max: f.matchLength || MAX_LENGTH, step: 1,
            value: g.toMin, "aria-label": "Goalie to minute", placeholder: "full time",
            onInput: (e) => api.updateGoalieShift(g._key, "toMin", e.target.value)
          });
          list.appendChild(el("div", { class: "sub-row" }, [
            el("div", null, [el("label", null, "Player"), playerSel]),
            el("div", null, [el("label", null, "From"), fromInput]),
            el("div", null, [el("label", null, "To"), toInput]),
            el("button", {
              class: "btn btn-sm btn-danger remove",
              onClick: () => api.removeGoalieShift(g._key),
              "aria-label": "Remove goalie shift"
            }, "×")
          ]));
        }
        goalieCard.appendChild(list);
      }
      root.appendChild(goalieCard);
      const statsCard = el("div", { class: "field" }, [
        el("div", { class: "picker-meta" }, [el("span", null, "Per-player stats")]),
        el("p", { class: "muted" }, "Goals required (default 0). Assists optional. Cards optional. Team score is independent of player goals.")
      ]);
      if (appeared.size === 0) {
        statsCard.appendChild(el("p", { class: "muted" }, "No appearances yet — pick starters first."));
      } else {
        const list = el("div");
        const orderedIds = players.map(p => p.id).filter(id => appeared.has(id));
        for (const pid of orderedIds) {
          const player = Store.getPlayer(pid);
          const cur = f.stats[pid] || { goals: 0, assists: 0, yellow: false, red: false };
          const goalsInput = el("input", {
            type: "number", min: 0, step: 1, required: true,
            value: cur.goals, "aria-label": `${player.name} goals`,
            onInput: (e) => api.setStat(pid, "goals", e.target.value === "" ? 0 : clampInt(e.target.value, 0, 999, 0))
          });
          const assistsInput = el("input", {
            type: "number", min: 0, step: 1,
            value: cur.assists, "aria-label": `${player.name} assists`, placeholder: "0",
            onInput: (e) => api.setStat(pid, "assists", e.target.value === "" ? 0 : clampInt(e.target.value, 0, 999, 0))
          });
          const yellow = el("label", {
            class: "toggle yellow" + (cur.yellow ? " on" : ""),
            "aria-pressed": cur.yellow ? "true" : "false"
          }, [
            el("input", { type: "checkbox", checked: cur.yellow,
              onChange: (e) => api.setStat(pid, "yellow", e.target.checked) }),
            el("span", { class: "swatch" }), "Yellow"
          ]);
          const red = el("label", {
            class: "toggle red" + (cur.red ? " on" : ""),
            "aria-pressed": cur.red ? "true" : "false"
          }, [
            el("input", { type: "checkbox", checked: cur.red,
              onChange: (e) => api.setStat(pid, "red", e.target.checked) }),
            el("span", { class: "swatch" }), "Red"
          ]);
          list.appendChild(el("div", { class: "stats-row" }, [
            el("div", { class: "name" }, player.name),
            el("div", null, [
              el("div", { class: "stat-line" }, [
                el("div", null, [el("label", null, "Goals"), goalsInput]),
                el("div", null, [el("label", null, "Assists"), assistsInput])
              ]),
              el("div", { class: "toggles", style: "margin-top:6px;" }, [yellow, red])
            ])
          ]));
        }
        statsCard.appendChild(list);
      }
      root.appendChild(statsCard);

      // Errors + actions
      if (f.errors && f.errors.length > 0) {
        root.appendChild(el("div", { class: "err" }, f.errors.join(" ")));
      }
      const canSave = f.errors.length === 0
        && f.opponent.trim() !== ""
        && f.date !== ""
        && f.ourScore !== "" && f.ourScore !== null
        && f.theirScore !== "" && f.theirScore !== null
        && f.starters.length === STARTERS_COUNT;
      root.appendChild(el("div", { class: "row", style: "margin-top:12px;" }, [
        el("button", { class: "btn btn-primary grow", disabled: !canSave, onClick: () => api.submit() }, "Save Match"),
        el("button", { class: "btn", onClick: () => api.cancel() }, "Cancel")
      ]));
    }

    /* ---------- Match detail ---------- */
    function renderMatchDetail(root, matchId, onBack, onDelete) {
      const m = Store.getState().matches.find(x => x.id === matchId);
      if (!m) {
        root.appendChild(el("section", { class: "card empty" }, [
          el("p", null, "Match not found."),
          el("button", { class: "btn", onClick: onBack }, "Back")
        ]));
        return;
      }
      const r = resultOf(m);
      const minutes = MinutesEngine.computeMinutesByPlayer(m.starters, m.subs, m.matchLength, m.goalieShifts);
      const goalieMins = MinutesEngine.goalieMinutesByPlayer(m.goalieShifts, m.matchLength);
      const appeared = MinutesEngine.summariseAppearances(m);
      const players = Store.getState().players;
      const starterSet = new Set(m.starters);
      const benchPlayers = players.filter(p => !starterSet.has(p.id));

      // Hero: compact single-card block. Score + opponent + result pill in
      // one row; back/delete row above; date/length in the metadata sub-line.
      // Replaces the 5-row stacked layout that ate ~180px of vertical space.
      const noShow = players.filter(p => !appeared.has(p.id));
      const head = el("section", { class: "card" }, [
        el("div", { class: "row" }, [
          el("button", { class: "btn btn-ghost btn-sm", onClick: onBack }, "← Back"),
          el("div", { class: "grow" }),
          el("button", { class: "btn btn-danger btn-sm", onClick: () => onDelete(m.id) }, "Delete")
        ]),
        el("div", { class: "match-hero" }, [
          el("div", { class: "m-score scoreboard" }, `${m.ourScore} – ${m.theirScore}`),
          el("div", { class: "m-meta" }, [
            el("div", { class: "m-opponent" }, "vs " + m.opponent),
            el("div", { class: "m-sub" }, fmtDate(m.date) + " · " + m.matchLength + " min")
          ]),
          el("div", { class: "m-result" }, el("span", { class: "pill " + r },
            r === "W" ? "Win" : (r === "D" ? "Draw" : "Loss")))
        ])
      ]);
      root.appendChild(head);

      // Per-player stats — surfaced first because it's the primary artifact
      // the coach cares about post-match (mins played, goals, assists, cards).
      const statsCard = el("section", { class: "card detail-section" }, [el("h3", null, "Per-player stats")]);
      const tbl = el("table", { class: "dash" }, [
        el("thead", null, [
          el("tr", null, [
            el("th", null, "Player"),
            el("th", { class: "num" }, "Min"),
            el("th", { class: "num" }, "G"),
            el("th", { class: "num" }, "A"),
            el("th", null, "Cards")
          ])
        ]),
        el("tbody", null, players
          .filter(p => appeared.has(p.id))
          .map(p => {
            const st = m.stats[p.id] || { goals: 0, assists: 0, yellow: false, red: false };
            const mins = minutes.get(p.id) || 0;
            const cards = [];
            if (st.yellow) cards.push("🟨");
            if (st.red)    cards.push("🟥");
            const gMin = goalieMins.get(p.id) || 0;
            const nameCell = gMin > 0
              ? el("td", null, [
                  el("div", null, p.name),
                  el("div", { class: "muted small" }, "🧤 " + gMin + "m in goal")
                ])
              : el("td", null, p.name);
            return el("tr", null, [
              nameCell,
              el("td", { class: "num" }, String(mins)),
              el("td", { class: "num" }, String(st.goals)),
              el("td", { class: "num" }, String(st.assists)),
              el("td", null, cards.join(" ") || "—")
            ]);
          }))
      ]);
      statsCard.appendChild(tbl);
      // Did-not-appear pill row nested inside the stats card — same context,
      // no dedicated section overhead.
      if (noShow.length > 0) {
        statsCard.appendChild(el("div", {
          class: "muted small",
          style: "margin: 8px 0 4px;"
        }, "Did not appear"));
        statsCard.appendChild(el("div", { class: "dna-row" },
          noShow.map(p => el("span", { class: "dna-pill" }, p.name))
        ));
      }
      root.appendChild(statsCard);

      // Unified timeline: goals + subs, chronological, single scannable list.
      // Colour-coded left border keeps the three kinds distinct at a glance.
      // Falls back to a scorer summary for legacy matches without a goals
      // timeline (pre-v1.2 saves).
      const timelineCard = el("section", { class: "card detail-section" }, [el("h3", null, "Timeline")]);
      const hasTimeline = Array.isArray(m.goals) && m.goals.length > 0;
      const eventsForTimeline = [];
      if (hasTimeline) {
        for (const g of m.goals) eventsForTimeline.push({ minute: g.minute || 0, kind: "goal", g });
      }
      for (const s of (m.subs || [])) eventsForTimeline.push({ minute: s.minute || 0, kind: "sub", s });
      eventsForTimeline.sort((a, b) => a.minute - b.minute);

      if (eventsForTimeline.length === 0 && !hasTimeline) {
        // Legacy fallback — no per-minute events at all. Show scorer summary.
        const scorers = players
          .filter(p => (m.stats[p.id]?.goals || 0) > 0 || (m.stats[p.id]?.assists || 0) > 0)
          .map(p => ({ id: p.id, name: p.name, ...m.stats[p.id] }))
          .sort((a, b) => (b.goals || 0) - (a.goals || 0));
        if (m.ourScore === 0 && m.theirScore === 0 && (m.subs || []).length === 0) {
          timelineCard.appendChild(el("p", { class: "muted" }, "No events."));
        } else {
          const list = el("ul", { class: "clean goals-summary" });
          for (const s of scorers) {
            const parts = [];
            if (s.goals)   parts.push(s.goals + "× ⚽");
            if (s.assists) parts.push(s.assists + "× 🅰");
            list.appendChild(el("li", { class: "goal-row goal-us" }, [
              el("span", { class: "g-scorer" }, s.name),
              el("span", { class: "g-tally" }, parts.join("  "))
            ]));
          }
          if (m.theirScore > 0) {
            list.appendChild(el("li", { class: "goal-row goal-them" }, [
              el("span", { class: "g-scorer" }, (m.opponent || "Opponent")),
              el("span", { class: "g-tally" }, m.theirScore + "× ⚽")
            ]));
          }
          timelineCard.appendChild(list);
        }
      } else {
        const list = el("div", { class: "timeline" });
        for (const ev of eventsForTimeline) {
          const minLabel = ev.minute + "′";
          if (ev.kind === "goal" && ev.g.side === "us") {
            const scorerName = ev.g.scorer ? Store.playerName(ev.g.scorer) : "(unknown)";
            const assist = ev.g.assist
              ? el("span", { class: "tl-assist" }, " (a: " + Store.playerName(ev.g.assist) + ")")
              : null;
            list.appendChild(el("div", { class: "tl-row tl-goal-us" }, [
              el("span", { class: "tl-time" }, minLabel),
              el("span", { class: "tl-icon" }, "⚽"),
              el("span", { class: "tl-text" }, assist ? [scorerName, assist] : [scorerName])
            ]));
          } else if (ev.kind === "goal") {
            list.appendChild(el("div", { class: "tl-row tl-goal-them" }, [
              el("span", { class: "tl-time" }, minLabel),
              el("span", { class: "tl-icon" }, "⚽"),
              el("span", { class: "tl-text muted" }, m.opponent || "Opponent")
            ]));
          } else {
            list.appendChild(el("div", { class: "tl-row tl-sub" }, [
              el("span", { class: "tl-time" }, minLabel),
              el("span", { class: "tl-icon" }, "↔"),
              el("span", { class: "tl-text" }, [
                Store.playerName(ev.s.off),
                el("span", { class: "tl-arrow" }, "→"),
                Store.playerName(ev.s.on)
              ])
            ]));
          }
        }
        timelineCard.appendChild(list);
      }
      root.appendChild(timelineCard);

      // Lineup — kept but compact and last (it's context, not the story).
      const lineup = el("section", { class: "card detail-section" }, [el("h3", null, "Lineup")]);
      const lineupItem = (name, kind) => el("li", { class: "lineup-li" }, [
        el("span", { class: "pinitial sm " + kind, "aria-hidden": "true" }, initialsOf(name)),
        el("span", { class: "lineup-name" }, name)
      ]);
      const grid = el("div", { class: "lineup-grid" }, [
        el("div", { class: "col" }, [
          el("h4", null, "Starters"),
          el("ul", { class: "clean" }, m.starters.map(id =>
            lineupItem(Store.playerName(id), "starter")))
        ]),
        el("div", { class: "col" }, [
          el("h4", null, "Bench"),
          el("ul", { class: "clean" }, benchPlayers.map(p =>
            lineupItem(p.name, "bench")))
        ])
      ]);
      lineup.appendChild(grid);
      root.appendChild(lineup);
    }

    /* ---------- Dashboard ---------- */
    function renderDashboard(root, sort, setSort) {
      renderLiveBanner(root);
      const s = Store.getState();
      const totals = new Map();
      for (const p of s.players) {
        totals.set(p.id, { id: p.id, matches: 0, minutes: 0, goals: 0, assists: 0 });
      }
      for (const m of s.matches) {
        const minutes = MinutesEngine.computeMinutesByPlayer(m.starters, m.subs, m.matchLength, m.goalieShifts);
        const goalieMins = MinutesEngine.goalieMinutesByPlayer(m.goalieShifts, m.matchLength);
        const appeared = MinutesEngine.summariseAppearances(m);
        for (const p of s.players) {
          const t = totals.get(p.id);
          const min = minutes.get(p.id) || 0;
          const gMin = goalieMins.get(p.id) || 0;
          // matches-played counts iff player took part in any capacity —
          // either outfield minutes OR keeper minutes for the match. A
          // starter who spent the entire match in goal still counts.
          if (appeared.has(p.id) && (min > 0 || gMin > 0)) t.matches += 1;
          t.minutes += min;
          const st = m.stats[p.id];
          if (st) {
            t.goals   += (st.goals   || 0);
            t.assists += (st.assists || 0);
          }
        }
      }

      const rows = s.players.map(p => Object.assign({ name: p.name }, totals.get(p.id)));

      const cmp = (a, b) => {
        const dir = sort.dir === "asc" ? 1 : -1;
        let av, bv;
        switch (sort.col) {
          case "name":    av = a.name.toLowerCase(); bv = b.name.toLowerCase(); break;
          case "matches": av = a.matches; bv = b.matches; break;
          case "minutes": av = a.minutes; bv = b.minutes; break;
          case "goals":   av = a.goals;   bv = b.goals;   break;
          case "assists": av = a.assists; bv = b.assists; break;
          default:        av = a.minutes; bv = b.minutes;
        }
        if (av < bv) return -1 * dir;
        if (av > bv) return  1 * dir;
        // Tie-break by name asc for stability
        return a.name.toLowerCase() < b.name.toLowerCase() ? -1 : 1;
      };
      rows.sort(cmp);

      const arrow = (col) => sort.col === col ? (sort.dir === "asc" ? "▲" : "▼") : "";
      const card = el("section", { class: "card" }, [
        el("h2", null, "Player Dashboard"),
        el("p", { class: "muted" }, "Totals derive live from saved matches. Tap a column to sort.")
      ]);
      const tbl = el("table", { class: "dash" }, [
        el("thead", null, [
          el("tr", null, [
            el("th", { onClick: () => setSort("name") },    ["Player ",  el("span", { class: "arrow" }, arrow("name"))]),
            el("th", { class: "num", onClick: () => setSort("matches") }, [el("span", { class: "arrow" }, arrow("matches")), " MP"]),
            el("th", { class: "num", onClick: () => setSort("minutes") }, [el("span", { class: "arrow" }, arrow("minutes")), " Min"]),
            el("th", { class: "num", onClick: () => setSort("goals") },   [el("span", { class: "arrow" }, arrow("goals")),   " G"]),
            el("th", { class: "num", onClick: () => setSort("assists") }, [el("span", { class: "arrow" }, arrow("assists")), " A"])
          ])
        ]),
        el("tbody", null, rows.map(r => el("tr", null, [
          el("td", null, r.name),
          el("td", { class: "num" }, String(r.matches)),
          el("td", { class: "num" }, String(r.minutes)),
          el("td", { class: "num" }, String(r.goals)),
          el("td", { class: "num" }, String(r.assists))
        ])))
      ]);
      card.appendChild(tbl);
      if (s.matches.length === 0) {
        card.appendChild(el("p", { class: "empty" },
          "No matches logged yet. Add a match in the Matches tab to see totals here."));
      }
      root.appendChild(card);
    }

    /* ---------- Live setup form ---------- */
    function renderLiveSetupForm(root, f, api) {
      const players = Store.getState().players;
      root.appendChild(el("div", { class: "stack" }, [
        el("div", { class: "field" }, [
          el("label", { for: "lf-opp" }, "Opponent"),
          el("input", {
            id: "lf-opp", type: "text", value: f.opponent, maxLength: 40,
            placeholder: "e.g. Mt Eden Mavericks",
            onInput: (e) => api.setSetupField("opponent", e.target.value)
          })
        ]),
        el("div", { class: "field" }, [
          el("label", { for: "lf-date" }, "Date"),
          el("input", { id: "lf-date", type: "date", value: f.date,
            onInput: (e) => api.setSetupField("date", e.target.value) })
        ])
      ]));

      // Starter picker
      root.appendChild(el("div", { class: "field" }, [
        el("label", null, [
          "Starters ",
          el("span", { class: "muted" }, `${f.starters.length}/${STARTERS_COUNT}`)
        ])
      ]));
      const grid = el("div", { class: "picker live-picker" });
      players.forEach((p) => {
        const isStarter = f.starters.includes(p.id);
        grid.appendChild(el("button", {
          type: "button",
          class: "pick-row" + (isStarter ? " starter" : ""),
          onClick: () => api.toggleStarter(p.id)
        }, [
          el("span", { class: "pinitial sm " + (isStarter ? "starter" : "bench"), "aria-hidden": "true" }, initialsOf(p.name)),
          el("span", { class: "grow" }, p.name),
          el("span", { class: "muted" }, isStarter ? "Starter" : "Bench")
        ]));
      });
      root.appendChild(grid);

      // Keeper picker — once 5 starters are chosen, the coach picks who
      // starts in goal. Selection is required; "Start match" stays disabled
      // until both gates pass.
      if (f.starters.length === STARTERS_COUNT) {
        root.appendChild(el("div", { class: "field" }, [
          el("label", null, [
            "Starting keeper ",
            el("span", { class: "muted" }, "🧤 pick 1 of 5")
          ])
        ]));
        const keeperGrid = el("div", { class: "picker live-picker" });
        for (const pid of f.starters) {
          const p = Store.getPlayer(pid);
          if (!p) continue;
          const isKeeper = f.keeperId === p.id;
          keeperGrid.appendChild(el("button", {
            type: "button",
            class: "pick-row" + (isKeeper ? " starter" : ""),
            onClick: () => api.pickKeeper(p.id)
          }, [
            el("span", { class: "pinitial sm " + (isKeeper ? "starter" : "bench"), "aria-hidden": "true" }, initialsOf(p.name)),
            el("span", { class: "grow" }, p.name),
            el("span", { class: "muted" }, isKeeper ? "🧤 In goal" : "Tap to choose")
          ]));
        }
        root.appendChild(keeperGrid);
      }

      if (f.errors.length) {
        root.appendChild(el("div", { class: "err" }, f.errors.join(" ")));
      }

      const canStart = f.starters.length === STARTERS_COUNT
                    && !!f.keeperId && f.starters.includes(f.keeperId);
      root.appendChild(el("div", { class: "row" }, [
        el("button", { class: "btn", onClick: () => api.cancelSetup() }, "Cancel"),
        el("div", { class: "grow" }),
        el("button", {
          class: "btn btn-primary",
          disabled: !canStart,
          onClick: () => api.start()
        }, "Start match")
      ]));
    }

    function fmtClock(ms) {
      const total = Math.max(0, Math.floor(ms / 1000));
      const m = Math.floor(total / 60);
      const s = total % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    /**
     * Live milliseconds-played per player at the current moment.
     * Walks sub events at their precise atMs (elapsed-ms when the sub fired),
     * not the integer subMinute used by the saved-record engine. This keeps
     * the on-pitch ticker accurate even when subs happen mid-minute.
     */
    function liveMillisecondsByPlayer() {
      const lm = Store.getLive();
      if (!lm) return new Map();
      // No planned-length cap — the clock runs until end-match.
      // liveElapsedMs already enforces the MAX_LENGTH hard ceiling.
      const elapsedMs = Store.liveElapsedMs();
      const subs = lm.events
        .filter(e => e.kind === "sub")
        .map(e => ({ off: e.off, on: e.on, atMs: Number.isFinite(e.atMs) ? e.atMs : (e.subMinute || 0) * 60000 }))
        .sort((a, b) => a.atMs - b.atMs);

      const ms = new Map();
      const stintStart = new Map(); // pid → ms-into-match when current stint started
      for (const pid of lm.starters) { stintStart.set(pid, 0); ms.set(pid, 0); }

      for (const s of subs) {
        if (s.atMs > elapsedMs) break;
        if (stintStart.has(s.off)) {
          const start = stintStart.get(s.off);
          ms.set(s.off, (ms.get(s.off) || 0) + Math.max(0, s.atMs - start));
          stintStart.delete(s.off);
        }
        stintStart.set(s.on, s.atMs);
        if (!ms.has(s.on)) ms.set(s.on, 0);
      }
      for (const [pid, start] of stintStart.entries()) {
        ms.set(pid, (ms.get(pid) || 0) + Math.max(0, elapsedMs - start));
      }
      // Subtract goalie time — the ticker for a player should freeze while
      // they're the active keeper. Mirrors MinutesEngine.computeMinutesByPlayer
      // but in milliseconds and against the current elapsed clock. Open shifts
      // (toMs===null) are capped at elapsedMs. (ISC-79, ISC-80.)
      const shifts = Array.isArray(lm.goalieShifts) ? lm.goalieShifts : [];
      for (const g of shifts) {
        const from = Math.max(0, Math.min(elapsedMs, g.fromMs || 0));
        const to   = (g.toMs === null || g.toMs === undefined)
          ? elapsedMs
          : Math.max(from, Math.min(elapsedMs, g.toMs));
        const gMs = Math.max(0, to - from);
        if (gMs <= 0) continue;
        ms.set(g.playerId, Math.max(0, (ms.get(g.playerId) || 0) - gMs));
      }
      return ms;
    }

    /* ---------- Live match view ---------- */
    function renderLiveMatch(root, picker, api) {
      const lm = Store.getLive();
      if (!lm) return;
      const elapsedMs = Store.liveElapsedMs();

      // Tally goals from events for the scoreline.
      let ourScore = 0, theirScore = 0;
      for (const e of lm.events) {
        if (e.kind === "goalUs") ourScore++;
        else if (e.kind === "goalThem") theirScore++;
      }

      // HUD
      const keeperId = Store.currentKeeperId();
      const keeperName = keeperId ? Store.playerName(keeperId) : "— none assigned —";
      const hud = el("section", { class: "live-hud" }, [
        el("div", { class: "opp-line" }, [
          el("span", { class: "opp" }, "vs " + (lm.opponent || "(opponent)")),
          el("span", { class: "status" }, lm.paused ? "Paused" : "Live")
        ]),
        el("div", { class: "scoreline" }, [
          el("div", { class: "side" }, [
            el("div", { class: "label" }, OUR_TEAM_NAME),
            el("div", { class: "val" }, String(ourScore))
          ]),
          el("div", { class: "clock" }, fmtClock(elapsedMs)),
          el("div", { class: "side" }, [
            el("div", { class: "label" }, lm.opponent || "Opponent"),
            el("div", { class: "val" }, String(theirScore))
          ])
        ]),
        el("div", { class: "keeper-row" }, [
          el("span", { class: "keeper-label" }, "🧤 In goal:"),
          el("span", { class: "keeper-name grow" }, keeperName),
          el("button", { class: "btn btn-sm btn-swap-keeper", onClick: () => api.beginSwapKeeper() },
            keeperId ? "Swap" : "Assign")
        ]),
        el("div", { class: "clock-row" }, [
          (lm.paused
            ? el("button", { class: "btn btn-resume", onClick: () => api.resume() }, "▶ Resume")
            : el("button", { class: "btn btn-pause",  onClick: () => api.pause()  }, "⏸ Pause")),
          el("button", { class: "btn btn-end", onClick: () => api.endMatch() }, "End match")
        ])
      ]);
      // If a picker is active, dim the HUD and float the picker card in a
      // centered modal over a full-viewport backdrop. Tapping outside the
      // card dismisses it. All picker kinds (sub / goal / card / keeper)
      // share this treatment for consistency.
      const pickerActive = !!picker;
      if (pickerActive) hud.classList.add("dimmed");
      root.appendChild(hud);

      if (pickerActive) {
        root.appendChild(el("div", { class: "picker-backdrop", onClick: () => api.cancelPicker() },
          el("div", {
            class: "picker-modal",
            onClick: (e) => { e.stopPropagation(); }
          }, renderLivePicker(picker, api))
        ));
      } else {
        const actions = el("div", { class: "live-actions" }, [
          el("button", { class: "btn btn-goal-us",   onClick: () => api.beginGoalUs()   }, "⚽ Goal — Us"),
          el("button", { class: "btn btn-goal-them", onClick: () => api.beginGoalThem() }, "Goal — Them"),
          el("button", { class: "btn btn-sub",       onClick: () => api.beginSub()      }, "↔ Sub"),
          el("button", { class: "btn btn-card",      onClick: () => api.beginCard()     }, "🟨 Card")
        ]);
        root.appendChild(actions);
      }

      // Live roster
      const players = Store.getState().players;
      const onPitch = Store.liveOnPitch();
      const playMs = liveMillisecondsByPlayer();
      const stats = computeLiveStats(lm);

      // Season fair-share targets — cumulative playing minutes ACROSS all
      // saved matches (excluding the current live match, which hasn't ended
      // yet). Playing time this match counts toward the visible progress via
      // `playMs`, not toward the season total until end-match commits.
      const allPlayerIds = players.map(p => p.id);
      const cumPlayed = SeasonEngine.seasonCumulativeMinutes(
        Store.getState().matches, allPlayerIds
      );
      const targets = SeasonEngine.computeMatchTargets(
        allPlayerIds, lm.matchLength || DEFAULT_LENGTH, cumPlayed
      );
      const targetMeta = targets.get("_meta") || { insufficient: false, unallocated: 0 };
      if (targetMeta.insufficient && targetMeta.unallocated > 0) {
        root.appendChild(el("div", { class: "muted live-hint" },
          "⚠ Season imbalance too large to rebalance this match — " +
          targetMeta.unallocated + "m unallocated. Distribute those minutes across on-pitch players as you see fit."
        ));
      }
      // Two marker scopes: on-pitch (who to keep on / sub off) and bench
      // (who to sub on next). ⭐ appears on the most-owed of each scope;
      // ⏸ (most-ahead) is on-pitch only — it's a sub-off signal, meaningless
      // for a bench player.
      const onPitchIds = players.filter(p => onPitch.has(p.id)).map(p => p.id);
      const benchIds   = players.filter(p => !onPitch.has(p.id)).map(p => p.id);
      const marksOnPitch = SeasonEngine.markPlayers(
        new Map(onPitchIds.map(id => [id, targets.get(id)]))
      );
      const marksBench = SeasonEngine.markPlayers(
        new Map(benchIds.map(id => [id, targets.get(id)]))
      );

      // Sub flow state (direct-tap):
      //   pitchFirst: coach tapped an on-pitch player first → bench armed to pick who comes on.
      //   benchFirst: coach tapped a bench player first    → on-pitch armed to pick who comes off.
      const pitchFirstSub = !!(picker && picker.kind === "sub" && picker.step === "on"  && picker.partial.off);
      const benchFirstSub = !!(picker && picker.kind === "sub" && picker.step === "off" && picker.partial.on);
      const preselectedOff = pitchFirstSub ? picker.partial.off : null;
      const preselectedOn  = benchFirstSub ? picker.partial.on  : null;
      // On-pitch rows are tappable when no picker is open (start a pitch-first
      // sub) OR when a bench-first sub is waiting for the off-tap.
      const onPitchTappable = !picker || benchFirstSub || pitchFirstSub;
      // Bench rows are tappable when no picker is open (start a bench-first
      // sub) OR when a pitch-first sub is waiting for the on-tap.
      const benchTappable   = !picker || pitchFirstSub || benchFirstSub;
      // Subs are allowed while paused — coaches use the pause to make calm subs.

      const onPitchCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "On the pitch (" + onPitch.size + ")")
      ]);
      if (!picker) {
        onPitchCard.appendChild(el("p", { class: "muted live-hint" },
          "Tap a player on the pitch or bench to start a sub."));
      } else if (pitchFirstSub) {
        onPitchCard.appendChild(el("p", { class: "muted live-hint" },
          "Pick a bench player to bring on, or tap another on-pitch player to change who's coming off."));
      } else if (benchFirstSub) {
        onPitchCard.appendChild(el("p", { class: "muted live-hint" },
          "Pick an on-pitch player to sub off, or tap another bench player to change who's coming on."));
      }
      const onPitchGrid = el("div", { class: "live-roster-grid" });
      players.filter(p => onPitch.has(p.id)).forEach((p, i) => {
        const armed = benchFirstSub;             // asking the coach to pick off-player
        const preselected = preselectedOff === p.id;
        onPitchGrid.appendChild(buildLiveRow(p, i + 1, playMs.get(p.id) || 0, stats[p.id], "on-pitch", {
          tappable: onPitchTappable,
          preselected,
          armed,
          isKeeper: p.id === keeperId,
          target:  targets.get(p.id),
          starred: marksOnPitch.mostOwedId  === p.id,
          paused:  marksOnPitch.mostAheadId === p.id,
          onClick: onPitchTappable ? () => api.directSubFromPitch(p.id) : null
        }));
      });
      onPitchCard.appendChild(onPitchGrid);
      root.appendChild(onPitchCard);

      const benchCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "Bench")
      ]);
      const benchGrid = el("div", { class: "live-roster-grid" });
      players.filter(p => !onPitch.has(p.id)).forEach((p) => {
        const armed = pitchFirstSub;             // asking the coach to pick on-player
        const preselected = preselectedOn === p.id;
        benchGrid.appendChild(buildLiveRow(p, "B", playMs.get(p.id) || 0, stats[p.id], "on-bench", {
          tappable: benchTappable,
          armed,
          preselected,
          target:  targets.get(p.id),
          starred: marksBench.mostOwedId === p.id,
          paused:  false,  // "most ahead" is a sub-off signal — meaningless on bench
          onClick: benchTappable ? () => api.directSubFromBench(p.id) : null
        }));
      });
      benchCard.appendChild(benchGrid);
      root.appendChild(benchCard);

      // Undo toast — sticky at bottom for 5s after a sub commits.
      if (lastSubToast) {
        const offName = Store.playerName(lastSubToast.offId);
        const onName  = Store.playerName(lastSubToast.onId);
        root.appendChild(el("div", { class: "sub-toast", role: "status" }, [
          el("span", { class: "sub-toast-text" }, "Sub: " + offName + " → " + onName),
          el("button", { class: "btn btn-sm sub-toast-undo", onClick: () => { api.undoLastSub(); render(); } }, "Undo")
        ]));
      }

      // Events log
      const eventsCard = el("section", { class: "card" }, [
        el("div", { class: "live-section-title" }, "Events"),
      ]);
      if (lm.events.length === 0) {
        eventsCard.appendChild(el("p", { class: "empty" }, "No events yet."));
      } else {
        const list = el("div", { class: "live-events" });
        lm.events.slice().reverse().forEach(ev => list.appendChild(buildEventRow(ev, api)));
        eventsCard.appendChild(list);
      }
      root.appendChild(eventsCard);

      // Cancel link
      root.appendChild(el("div", { class: "row" }, [
        el("button", { class: "btn btn-danger", onClick: () => api.cancelLive() }, "Discard live match")
      ]));
    }

    function computeLiveStats(lm) {
      const stats = {};
      for (const pid of lm.starters) stats[pid] = { goals: 0, assists: 0, yellow: false, red: false };
      for (const e of lm.events) {
        if (e.kind === "sub" && e.on) stats[e.on] = stats[e.on] || { goals: 0, assists: 0, yellow: false, red: false };
        if (e.kind === "goalUs") {
          if (e.scorer) { stats[e.scorer] = stats[e.scorer] || { goals: 0, assists: 0, yellow: false, red: false }; stats[e.scorer].goals++; }
          if (e.assist) { stats[e.assist] = stats[e.assist] || { goals: 0, assists: 0, yellow: false, red: false }; stats[e.assist].assists++; }
        } else if (e.kind === "yellow" && e.player) {
          stats[e.player] = stats[e.player] || { goals: 0, assists: 0, yellow: false, red: false };
          stats[e.player].yellow = true;
        } else if (e.kind === "red" && e.player) {
          stats[e.player] = stats[e.player] || { goals: 0, assists: 0, yellow: false, red: false };
          stats[e.player].red = true;
        }
      }
      return stats;
    }

    function buildLiveRow(p, badge, playedMs, st, klass, opts) {
      const o = opts || {};
      const meta = el("div", { class: "pmeta" });
      if (o.isKeeper)       meta.appendChild(el("span", { class: "pchip keeper", title: "In goal" }, "🧤"));
      if (st && st.goals)   meta.appendChild(el("span", { class: "pchip goal"   }, st.goals + "⚽"));
      if (st && st.assists) meta.appendChild(el("span", { class: "pchip assist" }, st.assists + "🅰"));
      if (st && st.yellow)  meta.appendChild(el("span", { class: "pchip yellow" }, "🟨"));
      if (st && st.red)     meta.appendChild(el("span", { class: "pchip red"    }, "🟥"));
      const initialsKlass = "pinitial sm " + (klass === "on-pitch" ? "starter" : "bench");
      const cls =
        "live-row " + klass +
        (o.tappable ? " tappable" : "") +
        (o.preselected ? " preselected" : "") +
        (o.armed ? " armed" : "") +
        (o.isKeeper ? " is-keeper" : "");
      const attrs = { class: cls };
      if (o.onClick) {
        attrs.role = "button";
        attrs.tabindex = "0";
        attrs.onClick = o.onClick;
        attrs.onKeyDown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); o.onClick(); } };
      }
      // Fair-share target chip — shows minutes-still-owed this match vs the
      // per-player target (playing minutes, so keeper time excluded).
      // Colours: yellow = still owed >= 2m, green = within 1m of target, grey = over.
      const targetChip = buildTargetChip(playedMs, o.target, o.starred, o.paused);
      const rightCol = el("div", { class: "prightcol" }, [
        el("span", { class: "ptime scoreboard" + (o.isKeeper ? " frozen" : "") }, fmtClock(playedMs)),
        targetChip
      ]);
      return el("div", attrs, [
        el("span", { class: "pos" }, String(badge)),
        el("span", { class: initialsKlass, "aria-hidden": "true" }, initialsOf(p.name)),
        el("span", { class: "pname" }, p.name),
        meta,
        rightCol
      ]);
    }

    /**
     * Fair-share chip: right of the live timer. Shows either the season
     * marker (⭐ most-owed / ⏸ most-ahead) or the minutes-still-owed for
     * this match. Keeper time already excluded — `playedMs` mirrors saved-
     * match math (see liveMillisecondsByPlayer subtraction, ISC-80).
     */
    function buildTargetChip(playedMs, target, starred, paused) {
      if (!target) return el("span", { class: "ptarget none" }, "");
      const playedMin = Math.floor(playedMs / 60000);
      const owed = target.target - playedMin;      // positive = still owed, negative = over
      let text;
      let state; // "owed" | "on" | "done" | "over"
      if (playedMin > target.target) {
        // Coach has kept them on past their target — surface the drift live so
        // it doesn't hide behind a static "done" pill (ISC-96).
        text = "+" + (playedMin - target.target) + "m over";
        state = "over";
      } else if (playedMin === target.target) {
        text = "✓ " + target.target + "m";
        state = "done";
      } else if (owed <= 1) {
        text = owed + "m";
        state = "on";
      } else {
        text = "+" + owed + "m";
        state = "owed";
      }
      const marker = starred ? "⭐ " : (paused ? "⏸ " : "");
      return el("span", {
        class: "ptarget " + state + (starred ? " star" : "") + (paused ? " ahead" : ""),
        title: "Target " + target.target + "m this match · played " + playedMin + "m · season deficit " + target.deficit + "m"
      }, marker + text);
    }

    function buildEventRow(ev, api) {
      const minLabel = (ev.minute || 0) + "′";
      let text = "";
      let klass = "kind-" + ev.kind;
      if (ev.kind === "goalUs") {
        const s = ev.scorer ? Store.playerName(ev.scorer) : "(unknown)";
        text = "Goal: " + s + (ev.assist ? " (a: " + Store.playerName(ev.assist) + ")" : "");
      } else if (ev.kind === "goalThem") {
        text = "Goal — opposition";
      } else if (ev.kind === "sub") {
        text = "Sub: " + Store.playerName(ev.off) + " → " + Store.playerName(ev.on);
      } else if (ev.kind === "yellow") {
        text = "Yellow card: " + Store.playerName(ev.player);
      } else if (ev.kind === "red") {
        text = "Red card: " + Store.playerName(ev.player);
      } else {
        text = ev.kind;
      }
      return el("div", { class: "live-event " + klass }, [
        el("span", { class: "e-time" }, minLabel),
        el("span", { class: "e-text" }, text),
        el("button", { class: "e-undo", onClick: () => api.undoEvent(ev.id) }, "undo")
      ]);
    }

    function renderLivePicker(picker, api) {
      const lm = Store.getLive();
      const players = Store.getState().players;
      const onPitch = Store.liveOnPitch();

      let title = "";
      let pool = [];
      let canSkip = false;
      if (picker.kind === "goalUs" && picker.step === "scorer") {
        title = "Who scored?";
        pool = players.filter(p => onPitch.has(p.id));
      } else if (picker.kind === "goalUs" && picker.step === "assist") {
        title = "Assist? (or skip)";
        pool = players.filter(p => onPitch.has(p.id));
        canSkip = true;
      } else if (picker.kind === "sub" && picker.step === "off") {
        title = "Who's coming off?";
        pool = players.filter(p => onPitch.has(p.id));
      } else if (picker.kind === "sub" && picker.step === "on") {
        title = "Who's coming on?";
        pool = players.filter(p => !onPitch.has(p.id));
      } else if (picker.kind === "card" && picker.step === "player") {
        title = "Card — which player?";
        pool = players;
      } else if (picker.kind === "card" && picker.step === "color") {
        title = "Yellow or red?";
      } else if (picker.kind === "swapKeeper" && picker.step === "player") {
        title = "🧤 Who's going in goal?";
        const currentKeeper = Store.currentKeeperId();
        pool = players.filter(p => onPitch.has(p.id) && p.id !== currentKeeper);
      }

      const card = el("section", { class: "card" }, [
        el("div", { class: "row" }, [
          el("h3", { class: "grow" }, title),
          el("button", { class: "btn", onClick: () => api.cancelPicker() }, "Cancel")
        ])
      ]);

      if (picker.kind === "card" && picker.step === "color") {
        card.appendChild(el("div", { class: "live-actions" }, [
          el("button", { class: "btn btn-card", onClick: () => api.pickCardColor("yellow") }, "🟨 Yellow"),
          el("button", { class: "btn btn-goal-them", onClick: () => api.pickCardColor("red") }, "🟥 Red")
        ]));
        return card;
      }

      const grid = el("div", { class: "picker live-picker" });
      pool.forEach(p => {
        grid.appendChild(el("button", {
          type: "button",
          class: "pick-row",
          onClick: () => api.pickPlayer(p.id)
        }, [
          el("span", { class: "pinitial sm", "aria-hidden": "true" }, initialsOf(p.name)),
          el("span", { class: "grow" }, p.name)
        ]));
      });
      card.appendChild(grid);
      if (canSkip) {
        card.appendChild(el("div", { class: "row" }, [
          el("button", { class: "btn", onClick: () => api.skipAssist() }, "No assist (skip)")
        ]));
      }
      return card;
    }

    return {
      renderRoster, renderMatches, renderDashboard, renderMatchDetail,
      renderLiveMatch
    };
  })();

  /* =========================================================================
   * Boot
   * ======================================================================= */
  document.addEventListener("DOMContentLoaded", App.init);

})();
</script>
</body>
</html>
